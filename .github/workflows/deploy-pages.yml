name: Deploy Campus Virtual to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Copy static files
        run: |
          # Create deployment directory
          mkdir -p _site
          
          # Copy app/ contents to root
          cp -r app/* _site/
          
          # Remove PHP files and backend-only directories
          rm -rf _site/api
          rm -rf _site/Backend_Scripts
          rm -rf _site/docs
          find _site -name "*.php" -delete
          
          # Create a simple .nojekyll to bypass Jekyll
          touch _site/.nojekyll

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
