canvas{display:block}

function rr(x,y,w,h,r,fl,st,sw){ctx.beginPath();ctx.moveTo(x+r,y);ctx.lineTo(x+w-r,y);ctx.quadraticCurveTo(x+w,y,x+w,y+r);ctx.lineTo(x+w,y+h-r);ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);ctx.lineTo(x+r,y+h);ctx.quadraticCurveTo(x,y+h,x,y+h-r);ctx.lineTo(x,y+r);ctx.quadraticCurveTo(x,y,x+r,y);ctx.closePath();if(fl){ctx.fillStyle=fl;ctx.fill()}if(st){ctx.strokeStyle=st;ctx.lineWidth=sw;ctx.stroke()}}

function dn(n){const s=sc;const x=(n.x+ox)*s,y=(n.y+oy)*s,w=n.w*s,h=n.h*s;const st=S[n.ty]||S.f;rr(x,y,w,h,8*s,st.f,st.s,2*s);ctx.fillStyle=st.t;ctx.font=`${Math.max(10,12*s)}px system-ui`;ctx.textAlign='center';ctx.textBaseline='middle';n.t.split('\n').forEach((l,i)=>ctx.fillText(l,x+w/2,y+h/2-8*s*(n.t.split('\n').length-1)/2+i*16*s));if(st.i)ctx.fillText(st.i,x+w-16*s,y+16*s);}

function de(e){const a=N.find(x=>x.id===e[0]),b=N.find(x=>x.id===e[1]);if(!a||!b)return;const s=sc;const fx=(a.x+a.w/2+ox)*s,fy=(a.y+a.h/2+oy)*s,tx=(b.x+b.w/2+ox)*s,ty=(b.y+b.h/2+oy)*s;const st=e[3]?S[e[3]]:{s:'#94A3B8'};ctx.beginPath();ctx.moveTo(fx,fy);const cx=(fx+tx)/2,cy=fy-60*s;ctx.quadraticCurveTo(cx,cy,tx,ty);ctx.strokeStyle=st.s||'#94A3B8';ctx.lineWidth=s;if(st.d)ctx.setLineDash(st.d.map(v=>v*s));else ctx.setLineDash([]);ctx.stroke();const ang=Math.atan2(ty-cy,tx-cx);const hl=10*s;ctx.beginPath();ctx.moveTo(tx,ty);ctx.lineTo(tx-hl*Math.cos(ang-Math.PI/6),ty-hl*Math.sin(ang-Math.PI/6));ctx.lineTo(tx-hl*Math.cos(ang+Math.PI/6),ty-hl*Math.sin(ang+Math.PI/6));ctx.closePath();ctx.fillStyle=st.s||'#94A3B8';ctx.fill();ctx.setLineDash([]);if(e[2]){ctx.fillStyle='#64748B';ctx.font=`${Math.max(8,10*s)}px system-ui`;ctx.textAlign='center';ctx.fillText(e[2],cx,cy-6*s);}}

function rd(){ctx.clearRect(0,0,cv.width,cv.height);if(grid){ctx.strokeStyle='#E2E8F0';ctx.lineWidth=sc;for(let x=0;x<cv.width;x+=50*sc){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,cv.height);ctx.stroke()}for(let y=0;y<cv.height;y+=50*sc){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(cv.width,y);ctx.stroke()}}E.forEach(de);N.forEach(dn);}

function gn(cx,cy){const r=cv.getBoundingClientRect();const x=(cx-r.left)/sc-ox,y=(cy-r.top)/sc-oy;return N.find(n=>x>=n.x&&x<=n.x+n.w&&y>=n.y&&y<=n.y+n.h);}

cv.addEventListener('mousemove',e=>{const n=gn(e.clientX,e.clientY);if(n){tt.classList.add('show');tt.innerHTML=n.d;tt.style.left=e.clientX+12+'px';tt.style.top=e.clientY+12+'px'}else tt.classList.remove('show');});
cv.addEventListener('mouseleave',()=>tt.classList.remove('show'));
cv.addEventListener('mousedown',e=>{if(e.button===0||e.button===2){pan=1;lx=e.clientX;ly=e.clientY;cv.style.cursor='grabbing'}});
window.addEventListener('mousemove',e=>{if(pan){ox+=(e.clientX-lx)/sc;oy+=(e.clientY-ly)/sc;lx=e.clientX;ly=e.clientY;rd()}});
window.addEventListener('mouseup',()=>{pan=0;cv.style.cursor='default'});
wrap.addEventListener('wheel',e=>{e.preventDefault();const f=e.deltaY>0?.9:1.1,nsc=Math.min(2,Math.max(.2,sc*f));const r=cv.getBoundingClientRect();const mx=(e.clientX-r.left)/sc-ox,my=(e.clientY-r.top)/sc-oy;ox=mx-(e.clientX-r.left)/nsc;oy=my-(e.clientY-r.top)/nsc;sc=nsc;rd()},{passive:false});

function zoom(f){const nsc=Math.min(2,Math.max(.2,sc*f));ox=cv.width/2/nsc-cv.width/2/sc+ox;oy=cv.height/2/nsc-cv.height/2/sc+oy;sc=nsc;rd()}
function resetView(){sc=.55;ox=0;oy=0;rd()}
function toggleGrid(){grid=1-grid;rd()}
function downloadPNG(){const a=document.createElement('a');a.download='flujograma-centuria-'+currentView+'.png';a.href=cv.toDataURL('image/png');a.click()}

function switchView(v){
currentView=v;
document.getElementById('viewTech').classList.toggle('active',v==='tech');
document.getElementById('viewRoles').classList.toggle('active',v==='roles');
document.getElementById('techControls').style.display=v==='tech'?'flex':'none';
document.getElementById('rolesControls').style.display=v==='roles'?'flex':'none';
document.getElementById('techLegend').style.display=v==='tech'?'flex':'none';
document.getElementById('rolesLegend').style.display=v==='roles'?'flex':'none';
document.getElementById('subtitle').textContent=v==='tech'?'Frontend (GitHub Pages) ↔ Backend GAS ↔ Google Sheets (28 hojas) + Drive':'Roles del sistema y sus interacciones (hover = detalle completo)';
if(v==='tech'){N=TN;E=TE;S=TS}else{N=RN;E=RE;S=RS}
resetView();
}

function resize(){cv.width=wrap.clientWidth;cv.height=Math.max(1000,wrap.clientHeight);rd()}
new ResizeObserver(resize).observe(wrap);resize();
</script>
