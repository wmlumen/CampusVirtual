<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel Administrativo — Centuria</title>
    <link rel="icon" type="image/x-icon" href="../favicon.ico">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <style>
        body { font-family: 'Montserrat', sans-serif; background: #0d2c16; color: #1e293b; }
        .glass-panel { background: rgba(255,255,255,0.95); backdrop-filter: blur(12px); border: 1px solid rgba(226,232,240,0.8); }
        .btn-primary { background: linear-gradient(135deg, #16813D, #0d2c16); color: white; transition: 0.3s; }
        .btn-primary:hover { box-shadow: 0 4px 12px rgba(22,129,61,0.3); transform: translateY(-1px); }
        .tab-active { background: #e8f5ec; color: #0d2c16; border-right: 3px solid #16813D; font-weight: 600; }
        .tab-inactive { color: #64748b; }
        .tab-inactive:hover { background: #f8fafc; color: #0f172a; }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
    </style>
    <script src="../js/api.js?v=12"></script>
    <script src="../js/centuria-plugins.js"></script>
    <script src="js/admin.js?v=4"></script>
</head>
<body x-data="adminPanel()" x-init="initPanel()">

    <!-- HEADER -->
    <header class="glass-panel sticky top-0 z-30 px-6 py-3 flex items-center justify-between shadow-sm">
        <div class="flex items-center gap-4">
            <img src="../images/logo_centuria.png" alt="Centuria" class="h-10" onerror="this.src='../logo_centuria.png'">
            <div>
                <h1 class="text-sm font-bold text-slate-800 tracking-wide uppercase" x-text="viewMode ? 'Vista: ' + viewRolLabel : 'Administracion Central'"></h1>
                <p class="text-[10px] font-medium"
                    :class="viewMode ? 'text-amber-600' : 'text-slate-500'"
                    x-text="viewMode ? 'Modo vista previa — ' + viewRolLabel : 'Nivel: ' + rolLabel"></p>
            </div>
        </div>
        <div class="flex items-center gap-3">
            <!-- DROPDOWN VISTA PREVIA -->
            <div class="relative" x-data="{ open: false }">
                <button @click="open=!open" class="flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-[10px] font-bold transition"
                    :class="viewMode ? 'bg-amber-100 text-amber-700 hover:bg-amber-200' : 'bg-slate-100 text-slate-600 hover:bg-slate-200'">
                    <i class="bi bi-eye-fill"></i>
                    <span x-text="viewMode ? viewRolLabel : 'Vista Previa'"></span>
                    <i class="bi bi-chevron-down text-[8px]"></i>
                </button>
                <div x-show="open" @click.away="open=false" x-transition
                    class="absolute right-0 top-full mt-1 w-72 bg-white rounded-xl shadow-xl border border-slate-100 py-2 z-50">
                    <p class="text-[8px] font-bold text-slate-400 uppercase px-3 mb-1">Ver como...</p>
                    <template x-for="v in vistasDisponibles" :key="v.id">
                        <div class="px-3 py-2 hover:bg-slate-50 cursor-pointer flex items-center gap-3 transition"
                            @click="open=false; abrirVistaPrevia(v)">
                            <div class="w-8 h-8 rounded-lg flex items-center justify-center text-white text-xs" :style="'background:' + v.color">
                                <i class="bi" :class="v.icon"></i>
                            </div>
                            <div class="flex-1">
                                <p class="text-[11px] font-bold text-slate-700" x-text="v.label"></p>
                                <p class="text-[8px] text-slate-400" x-text="v.desc"></p>
                            </div>
                            <i class="bi bi-box-arrow-up-right text-[9px] text-slate-300"></i>
                        </div>
                    </template>
                    <div class="border-t border-slate-100 mt-1 pt-1">
                        <p class="text-[8px] font-bold text-slate-400 uppercase px-3 mb-1">Abrir en nueva pestana</p>
                        <template x-for="v in vistasDisponibles" :key="'new-'+v.id">
                            <div class="px-3 py-1.5 hover:bg-slate-50 cursor-pointer flex items-center gap-2 transition text-[10px] text-slate-500"
                                @click="open=false; abrirEnNuevaTab(v)">
                                <i class="bi bi-box-arrow-up-right text-[9px]"></i>
                                <span x-text="v.label"></span>
                            </div>
                        </template>
                    </div>
                </div>
            </div>
            <span class="text-[10px] bg-emerald-100 text-emerald-800 px-3 py-1 rounded-full font-bold tracking-wide" x-text="userName"></span>
            <button x-show="viewMode" @click="cerrarVistaPrevia(); switchTab('usuarios')"
                class="px-3 py-1.5 rounded-lg text-[10px] font-bold bg-amber-500 text-white hover:bg-amber-600 transition">
                <i class="bi bi-arrow-left me-1"></i>Volver al Admin
            </button>
            <button @click="cerrarSesion()" class="p-2 rounded-xl hover:bg-rose-50 text-rose-500 transition" title="Cerrar Sesion">
                <i class="bi bi-box-arrow-right text-lg"></i>
            </button>
        </div>
    </header>

    <div class="flex h-[calc(100vh-65px)]">

        <!-- SIDEBAR -->
        <aside class="w-64 glass-panel border-t-0 shadow-sm flex flex-col py-4 z-20">
            <p class="text-[9px] font-bold text-slate-400 tracking-widest uppercase px-6 mb-3">Módulos</p>

            <button @click="switchTab('usuarios')" class="text-left px-6 py-3 text-xs flex items-center gap-3 transition-colors"
                :class="activeTab==='usuarios' ? 'tab-active' : 'tab-inactive'">
                <i class="bi bi-people-fill text-base"></i> Usuarios
            </button>
            <button x-show="userRole === 'admin' || userRole === 'academico'" @click="switchTab('asignaturas')" class="text-left px-6 py-3 text-xs flex items-center gap-3 transition-colors"
                :class="activeTab==='asignaturas' ? 'tab-active' : 'tab-inactive'">
                <i class="bi bi-book-fill text-base"></i> Asignaturas
            </button>
            <button x-show="userRole === 'admin'" @click="switchTab('filiales')" class="text-left px-6 py-3 text-xs flex items-center gap-3 transition-colors"
                :class="activeTab==='filiales' ? 'tab-active' : 'tab-inactive'">
                <i class="bi bi-geo-alt-fill text-base"></i> Filiales
            </button>
            <button @click="switchTab('cursos')" class="text-left px-6 py-3 text-xs flex items-center gap-3 transition-colors"
                :class="activeTab==='cursos' ? 'tab-active' : 'tab-inactive'">
                <i class="bi bi-grid-3x3-gap-fill text-base"></i> Catálogos
            </button>
            <button @click="switchTab('reportes')" class="text-left px-6 py-3 text-xs flex items-center gap-3 transition-colors"
                :class="activeTab==='reportes' ? 'tab-active' : 'tab-inactive'">
                <i class="bi bi-bar-chart-fill text-base"></i> Reportes
            </button>
            <button x-show="userRole === 'admin'" @click="switchTab('formularios')" class="text-left px-6 py-3 text-xs flex items-center gap-3 transition-colors"
                :class="activeTab==='formularios' ? 'tab-active' : 'tab-inactive'">
                <i class="bi bi-file-earmark-text-fill text-base"></i> Formularios
            </button>
            <button x-show="userRole === 'admin'" @click="switchTab('config')" class="text-left px-6 py-3 text-xs flex items-center gap-3 transition-colors"
                :class="activeTab==='config' ? 'tab-active' : 'tab-inactive'">
                <i class="bi bi-gear-fill text-base"></i> Configuración
            </button>
            <div class="border-t border-slate-200 my-2"></div>
            <p class="text-[9px] font-bold text-slate-400 tracking-widest uppercase px-6 mb-2 mt-1">Vista Previa</p>
            <template x-for="v in vistasDisponibles" :key="'sidebar-'+v.id">
                <button @click="abrirVistaPrevia(v)" class="text-left px-6 py-2.5 text-[11px] flex items-center gap-3 transition-colors text-slate-500 hover:bg-slate-50 hover:text-slate-800">
                    <div class="w-5 h-5 rounded flex items-center justify-center text-white" :style="'background:' + v.color">
                        <i class="bi text-[8px]" :class="v.icon"></i>
                    </div>
                    <span x-text="v.label"></span>
                    <i class="bi bi-box-arrow-up-right text-[8px] text-slate-300 ml-auto"></i>
                </button>
            </template>
        </aside>

        <!-- MAIN CONTENT — Secciones se cargan dinámicamente aqui -->
        <main class="flex-1 overflow-y-auto p-6 bg-slate-50 relative">

            <!-- LOADER OVERLAY -->
            <div x-show="loading" class="absolute inset-0 bg-white/50 backdrop-blur-sm z-50 flex flex-col items-center justify-center">
                <div class="animate-spin rounded-full h-10 w-10 border-b-2 border-emerald-600 mb-3"></div>
                <p class="text-xs font-semibold text-emerald-700" x-text="loadingText"></p>
            </div>

            <!-- CONTENIDO DINAMICO -->
            <div id="section-container"></div>

        </main>
    </div>

</body>
</html>
