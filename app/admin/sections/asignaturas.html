<!-- SECCIÓN: ASIGNATURAS -->
<div x-data="{ 
    showForm: false,
    form: $data.formAsignatura,
    selected: $data.selectedAsignatura
}" class="space-y-6">

    <!-- ENCABEZADO -->
    <div class="flex items-center justify-between">
        <div>
            <h2 class="text-lg font-bold text-slate-800 flex items-center gap-2">
                <i class="bi bi-book-fill text-emerald-600"></i> Asignaturas
            </h2>
            <p class="text-xs text-slate-500 mt-1">Gestión de asignaturas del sistema</p>
        </div>
        <button @click="showForm = !showForm; selectedAsignatura = null; formAsignatura = { nombre: '', codigo: '', carrera: '', semestre: 1, carga_horaria: 0, color: '#10b981', icono: 'bi-book' }"
            class="btn-primary px-4 py-2 rounded-lg text-xs font-bold flex items-center gap-2">
            <i class="bi" :class="showForm ? 'bi-x-lg' : 'bi-plus-lg'"></i>
            <span x-text="showForm ? 'Cancelar' : 'Nueva Asignatura'"></span>
        </button>
    </div>

    <!-- FORMULARIO -->
    <div x-show="showForm" x-transition class="glass-panel rounded-xl p-5">
        <h3 class="text-sm font-bold text-slate-700 mb-4" x-text="selectedAsignatura ? 'Editar Asignatura' : 'Nueva Asignatura'"></h3>
        <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
            <div>
                <label class="text-[10px] font-bold text-slate-500 uppercase">Nombre *</label>
                <input type="text" x-model="formAsignatura.nombre" class="w-full mt-1 px-3 py-2 text-xs border border-slate-200 rounded-lg focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500">
            </div>
            <div>
                <label class="text-[10px] font-bold text-slate-500 uppercase">Código *</label>
                <input type="text" x-model="formAsignatura.codigo" class="w-full mt-1 px-3 py-2 text-xs border border-slate-200 rounded-lg focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500" placeholder="Ej: TIC-101">
            </div>
            <div>
                <label class="text-[10px] font-bold text-slate-500 uppercase">Carrera</label>
                <input type="text" x-model="formAsignatura.carrera" class="w-full mt-1 px-3 py-2 text-xs border border-slate-200 rounded-lg focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500">
            </div>
            <div>
                <label class="text-[10px] font-bold text-slate-500 uppercase">Semestre</label>
                <select x-model="formAsignatura.semestre" class="w-full mt-1 px-3 py-2 text-xs border border-slate-200 rounded-lg focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500">
                    <option value="1">1° Semestre</option>
                    <option value="2">2° Semestre</option>
                    <option value="3">3° Semestre</option>
                    <option value="4">4° Semestre</option>
                    <option value="5">5° Semestre</option>
                    <option value="6">6° Semestre</option>
                </select>
            </div>
            <div>
                <label class="text-[10px] font-bold text-slate-500 uppercase">Carga Horaria</label>
                <input type="number" x-model="formAsignatura.carga_horaria" class="w-full mt-1 px-3 py-2 text-xs border border-slate-200 rounded-lg focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500" min="0">
            </div>
            <div>
                <label class="text-[10px] font-bold text-slate-500 uppercase">Color</label>
                <input type="color" x-model="formAsignatura.color" class="w-full mt-1 h-9 border border-slate-200 rounded-lg cursor-pointer">
            </div>
            <div>
                <label class="text-[10px] font-bold text-slate-500 uppercase">Icono</label>
                <input type="text" x-model="formAsignatura.icono" class="w-full mt-1 px-3 py-2 text-xs border border-slate-200 rounded-lg focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500" placeholder="bi-book">
            </div>
            <div class="flex items-end">
                <button @click="guardarAsignatura()" class="btn-primary px-4 py-2 rounded-lg text-xs font-bold w-full">
                    <i class="bi bi-check-lg me-1"></i> Guardar
                </button>
            </div>
        </div>
    </div>

    <!-- BÚSQUEDA Y FILTROS -->
    <div class="flex items-center gap-3">
        <div class="flex-1 relative">
            <i class="bi bi-search absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 text-xs"></i>
            <input type="text" x-model="asignaturaSearch" placeholder="Buscar asignatura..."
                class="w-full pl-9 pr-4 py-2 text-xs border border-slate-200 rounded-lg focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500">
        </div>
        <span class="text-[10px] text-slate-400" x-text="filteredAsignaturas.length + ' resultados'"></span>
    </div>

    <!-- TABLA -->
    <div class="glass-panel rounded-xl overflow-hidden">
        <table class="w-full text-xs">
            <thead class="bg-slate-50 border-b border-slate-200">
                <tr>
                    <th class="text-left px-4 py-3 font-bold text-slate-600">Asignatura</th>
                    <th class="text-left px-4 py-3 font-bold text-slate-600">Código</th>
                    <th class="text-left px-4 py-3 font-bold text-slate-600">Carrera</th>
                    <th class="text-left px-4 py-3 font-bold text-slate-600">Semestre</th>
                    <th class="text-left px-4 py-3 font-bold text-slate-600">Horas</th>
                    <th class="text-center px-4 py-3 font-bold text-slate-600">Acciones</th>
                </tr>
            </thead>
            <tbody>
                <template x-for="a in filteredAsignaturas" :key="a.id">
                    <tr class="border-b border-slate-100 hover:bg-slate-50 transition">
                        <td class="px-4 py-3">
                            <div class="flex items-center gap-2">
                                <div class="w-8 h-8 rounded-lg flex items-center justify-center text-white text-xs" :style="'background:' + (a.color || '#10b981')">
                                    <i class="bi" :class="a.icono || 'bi-book'"></i>
                                </div>
                                <span class="font-semibold text-slate-700" x-text="a.nombre"></span>
                            </div>
                        </td>
                        <td class="px-4 py-3 text-slate-500" x-text="a.codigo"></td>
                        <td class="px-4 py-3 text-slate-500" x-text="a.carrera || '-'"></td>
                        <td class="px-4 py-3 text-slate-500" x-text="a.semestre + '°'"></td>
                        <td class="px-4 py-3 text-slate-500" x-text="a.carga_horaria + 'h'"></td>
                        <td class="px-4 py-3 text-center whitespace-nowrap">
                            <button @click="abrirAsignar(a)" class="p-1.5 rounded-lg hover:bg-emerald-50 text-emerald-600 transition" title="Asignar a docente">
                                <i class="bi bi-person-plus text-xs"></i>
                            </button>
                            <button @click="seleccionarAsignatura(a); showForm = true" class="p-1.5 rounded-lg hover:bg-blue-50 text-blue-500 transition" title="Editar">
                                <i class="bi bi-pencil text-xs"></i>
                            </button>
                            <button @click="eliminarAsignatura(a)" class="p-1.5 rounded-lg hover:bg-rose-50 text-rose-500 transition" title="Eliminar">
                                <i class="bi bi-trash text-xs"></i>
                            </button>
                        </td>
                    </tr>
                </template>
                <tr x-show="filteredAsignaturas.length === 0">
                    <td colspan="6" class="px-4 py-8 text-center text-slate-400">
                        <i class="bi bi-inbox text-2xl mb-2 block"></i>
                        <p class="text-xs">No hay asignaturas registradas</p>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>

    <!-- Panel: asignar docente por cédula -->
    <div x-show="assignTarget" style="display:none;" class="glass-panel rounded-xl p-5 border-emerald-200">
        <h3 class="text-sm font-bold text-emerald-800 mb-1">
            <i class="bi bi-person-plus-fill me-1"></i>Asignar <span x-text="assignTarget ? assignTarget.codigo : ''"></span> a un docente
        </h3>
        <p class="text-[10px] text-slate-500 mb-3">Busca al docente por su cédula. Al confirmar, la asignatura aparece en su panel.</p>
        <div class="flex gap-2 flex-wrap items-end">
            <div>
                <label class="text-[10px] font-bold text-slate-500 uppercase">Cédula del docente</label>
                <input type="text" x-model="assignCedula" placeholder="Ej: 1340125" @input="assignCedula=assignCedula.replace(/\./g,'')"
                    @keydown.enter.prevent="buscarDocenteAsignar()"
                    class="block px-3 py-2 border border-slate-200 rounded-lg text-xs mt-1 w-40">
            </div>
            <button @click="buscarDocenteAsignar()" class="btn-primary px-4 py-2 rounded-lg text-xs font-bold">
                <i class="bi bi-search me-1"></i>Buscar
            </button>
            <div x-show="assignFound" class="px-3 py-2 bg-emerald-50 border border-emerald-300 rounded-lg text-xs font-bold text-emerald-800">
                <i class="bi bi-check-circle-fill me-1"></i><span x-text="assignFound ? assignFound.nombre_completo : ''"></span>
                (<span x-text="assignFound ? assignFound.cedula : ''"></span>)
            </div>
            <div>
                <label class="text-[10px] font-bold text-slate-500 uppercase">Carrera</label>
                <input type="text" x-model="assignCarrera" class="block px-3 py-2 border border-slate-200 rounded-lg text-xs mt-1 w-44">
            </div>
            <div>
                <label class="text-[10px] font-bold text-slate-500 uppercase">Sección</label>
                <input type="text" x-model="assignSeccion" placeholder="Ej: S026" class="block px-3 py-2 border border-slate-200 rounded-lg text-xs mt-1 w-24">
            </div>
            <button @click="confirmarAsignacion()" :disabled="!assignFound" :class="!assignFound ? 'opacity-40 cursor-not-allowed' : ''"
                class="bg-emerald-600 text-white px-4 py-2 rounded-lg text-xs font-bold">
                <i class="bi bi-check-lg me-1"></i>Confirmar
            </button>
            <button @click="cerrarAsignar()" class="text-xs text-slate-500 hover:underline px-2 py-2">Cancelar</button>
        </div>
    </div>
</div>
