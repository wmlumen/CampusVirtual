<!-- SECCIÓN: FILIALES -->
<div x-data="{
    showForm: false,
    selectedFilial: null,
    formFilial: { nombre: '', codigo: '', direccion: '' }
}" class="space-y-6">

    <!-- ENCABEZADO -->
    <div class="flex items-center justify-between">
        <div>
            <h2 class="text-lg font-bold text-slate-800 flex items-center gap-2">
                <i class="bi bi-geo-alt-fill text-emerald-600"></i> Filiales
            </h2>
            <p class="text-xs text-slate-500 mt-1">Gestión de filiales del sistema</p>
        </div>
        <button @click="showForm = !showForm; selectedFilial = null; formFilial = { nombre: '', codigo: '', direccion: '' }"
            class="btn-primary px-4 py-2 rounded-lg text-xs font-bold flex items-center gap-2">
            <i class="bi" :class="showForm ? 'bi-x-lg' : 'bi-plus-lg'"></i>
            <span x-text="showForm ? 'Cancelar' : 'Nueva Filial'"></span>
        </button>
    </div>

    <!-- FORMULARIO -->
    <div x-show="showForm" x-transition class="glass-panel rounded-xl p-5">
        <h3 class="text-sm font-bold text-slate-700 mb-4" x-text="selectedFilial ? 'Editar Filial' : 'Nueva Filial'"></h3>
        <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
            <div>
                <label class="text-[10px] font-bold text-slate-500 uppercase">Nombre *</label>
                <input type="text" x-model="formFilial.nombre" class="w-full mt-1 px-3 py-2 text-xs border border-slate-200 rounded-lg focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500" placeholder="Ej: Filial Quito">
            </div>
            <div>
                <label class="text-[10px] font-bold text-slate-500 uppercase">Código *</label>
                <input type="text" x-model="formFilial.codigo" class="w-full mt-1 px-3 py-2 text-xs border border-slate-200 rounded-lg focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500" placeholder="Ej: UIO">
            </div>
            <div>
                <label class="text-[10px] font-bold text-slate-500 uppercase">Dirección</label>
                <input type="text" x-model="formFilial.direccion" class="w-full mt-1 px-3 py-2 text-xs border border-slate-200 rounded-lg focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500">
            </div>
        </div>
        <div class="flex justify-end mt-4">
            <button @click="crearFilial()" class="btn-primary px-4 py-2 rounded-lg text-xs font-bold">
                <i class="bi bi-check-lg me-1"></i> Guardar
            </button>
        </div>
    </div>

    <!-- TABLA -->
    <div class="glass-panel rounded-xl overflow-hidden">
        <table class="w-full text-xs">
            <thead class="bg-slate-50 border-b border-slate-200">
                <tr>
                    <th class="text-left px-4 py-3 font-bold text-slate-600">Filial</th>
                    <th class="text-left px-4 py-3 font-bold text-slate-600">Código</th>
                    <th class="text-left px-4 py-3 font-bold text-slate-600">Dirección</th>
                    <th class="text-center px-4 py-3 font-bold text-slate-600">Acciones</th>
                </tr>
            </thead>
            <tbody>
                <template x-for="f in filiales" :key="f.id">
                    <tr class="border-b border-slate-100 hover:bg-slate-50 transition">
                        <td class="px-4 py-3">
                            <div class="flex items-center gap-2">
                                <div class="w-8 h-8 rounded-lg bg-emerald-100 flex items-center justify-center text-emerald-600 text-xs">
                                    <i class="bi bi-geo-alt-fill"></i>
                                </div>
                                <span class="font-semibold text-slate-700" x-text="f.nombre"></span>
                            </div>
                        </td>
                        <td class="px-4 py-3 text-slate-500" x-text="f.codigo"></td>
                        <td class="px-4 py-3 text-slate-500" x-text="f.direccion || '-'"></td>
                        <td class="px-4 py-3 text-center">
                            <button @click="selectedFilial = f; formFilial = { nombre: f.nombre, codigo: f.codigo, direccion: f.direccion || '' }; showForm = true" 
                                class="p-1.5 rounded-lg hover:bg-blue-50 text-blue-500 transition" title="Editar">
                                <i class="bi bi-pencil text-xs"></i>
                            </button>
                            <button @click="eliminarFilial(f.id)" class="p-1.5 rounded-lg hover:bg-rose-50 text-rose-500 transition" title="Eliminar">
                                <i class="bi bi-trash text-xs"></i>
                            </button>
                        </td>
                    </tr>
                </template>
                <tr x-show="filiales.length === 0">
                    <td colspan="4" class="px-4 py-8 text-center text-slate-400">
                        <i class="bi bi-inbox text-2xl mb-2 block"></i>
                        <p class="text-xs">No hay filiales registradas</p>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</div>
