<!-- SECCION: Reportes — Fragmento HTML cargado dinámicamente -->
<div class="space-y-6" x-data>

    <h2 class="text-sm font-bold text-slate-800">
        <i class="bi bi-bar-chart-fill text-emerald-600 me-2"></i>Reportes del Sistema
    </h2>

    <!-- TARJETAS RESUMEN -->
    <div class="grid grid-cols-4 gap-4">
        <div class="bg-white rounded-2xl p-4 shadow-sm border border-slate-100">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-full bg-emerald-50 text-emerald-600 flex items-center justify-center">
                    <i class="bi bi-people-fill"></i>
                </div>
                <div>
                    <p class="text-xl font-bold text-slate-800" x-text="stats.totalCedulas"></p>
                    <p class="text-[9px] font-bold text-slate-400 uppercase">Usuarios</p>
                </div>
            </div>
        </div>
        <div class="bg-white rounded-2xl p-4 shadow-sm border border-slate-100">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-full bg-blue-50 text-blue-600 flex items-center justify-center">
                    <i class="bi bi-mortarboard-fill"></i>
                </div>
                <div>
                    <p class="text-xl font-bold text-slate-800" x-text="stats.alumnos"></p>
                    <p class="text-[9px] font-bold text-slate-400 uppercase">Alumnos</p>
                </div>
            </div>
        </div>
        <div class="bg-white rounded-2xl p-4 shadow-sm border border-slate-100">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-full bg-amber-50 text-amber-600 flex items-center justify-center">
                    <i class="bi bi-person-badge-fill"></i>
                </div>
                <div>
                    <p class="text-xl font-bold text-slate-800" x-text="stats.docentes"></p>
                    <p class="text-[9px] font-bold text-slate-400 uppercase">Docentes</p>
                </div>
            </div>
        </div>
        <div class="bg-white rounded-2xl p-4 shadow-sm border border-slate-100">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-full bg-purple-50 text-purple-600 flex items-center justify-center">
                    <i class="bi bi-grid-3x3-gap-fill"></i>
                </div>
                <div>
                    <p class="text-xl font-bold text-slate-800" x-text="catalogStats.totalSecciones"></p>
                    <p class="text-[9px] font-bold text-slate-400 uppercase">Secciones</p>
                </div>
            </div>
        </div>
    </div>

    <div class="flex gap-6">
        <!-- DISTRIBUCION POR ROLES -->
        <div class="bg-white rounded-2xl shadow-sm border border-slate-100 p-5 flex-1">
            <h3 class="text-xs font-bold text-slate-700 mb-4">
                <i class="bi bi-pie-chart-fill text-emerald-600 me-2"></i>Distribucion por Roles
            </h3>
            <div class="space-y-3">
                <template x-for="r in rolesPorTipo" :key="r.tipo">
                    <div>
                        <div class="flex justify-between text-[10px] mb-1">
                            <span class="font-bold text-slate-600 uppercase" x-text="r.tipo"></span>
                            <span class="text-slate-400" x-text="r.cantidad + ' registros'"></span>
                        </div>
                        <div class="w-full bg-slate-100 rounded-full h-3">
                            <div class="h-3 rounded-full transition-all"
                                :style="'width:' + r.porcentaje + '%;background:' + r.color"></div>
                        </div>
                    </div>
                </template>
                <div x-show="rolesPorTipo.length === 0" class="text-center py-4 text-slate-400 text-xs">Sin datos</div>
            </div>
        </div>

        <!-- CARRERAS MAS ASIGNADAS -->
        <div class="bg-white rounded-2xl shadow-sm border border-slate-100 p-5 flex-1">
            <h3 class="text-xs font-bold text-slate-700 mb-4">
                <i class="bi bi-book-fill text-blue-600 me-2"></i>Carreras / Programas
            </h3>
            <div class="space-y-2">
                <template x-for="c in carrerasTop" :key="c.nombre">
                    <div class="flex items-center justify-between p-2 rounded-lg hover:bg-slate-50 transition">
                        <div class="flex items-center gap-2">
                            <div class="w-2 h-2 rounded-full" :style="'background:' + c.color"></div>
                            <span class="text-xs font-medium text-slate-700" x-text="c.nombre || 'Sin carrera'"></span>
                        </div>
                        <span class="text-[10px] font-bold text-slate-500 bg-slate-100 px-2 py-0.5 rounded"
                            x-text="c.cantidad"></span>
                    </div>
                </template>
                <div x-show="carrerasTop.length === 0" class="text-center py-4 text-slate-400 text-xs">Sin datos</div>
            </div>
        </div>

        <!-- ACCESOS RECIENTES -->
        <div class="bg-white rounded-2xl shadow-sm border border-slate-100 p-5 w-72">
            <h3 class="text-xs font-bold text-slate-700 mb-4">
                <i class="bi bi-clock-fill text-amber-600 me-2"></i>Accesos Recientes
            </h3>
            <div class="space-y-2">
                <template x-for="a in accesosRecientes" :key="a.username">
                    <div class="flex items-center gap-2 p-2 rounded-lg hover:bg-slate-50 transition text-[10px]">
                        <div class="w-7 h-7 rounded-full bg-emerald-100 text-emerald-700 flex items-center justify-center text-[9px] font-bold"
                            x-text="(a.firstname||'?')[0]"></div>
                        <div class="flex-1 min-w-0">
                            <p class="font-bold text-slate-700 truncate"
                                x-text="(a.firstname||'') + ' ' + (a.lastname||'')"></p>
                            <p class="text-slate-400" x-text="'CI: ' + a.username"></p>
                        </div>
                    </div>
                </template>
                <div x-show="accesosRecientes.length === 0" class="text-center py-4 text-slate-400 text-xs">Sin accesos</div>
            </div>
        </div>
    </div>

    <!-- CATALOGOS RESUMEN -->
    <div class="grid grid-cols-5 gap-3">
        <template x-for="(items, key) in catalogData" :key="key">
            <div class="bg-white rounded-xl p-3 shadow-sm border border-slate-100 text-center">
                <p class="text-2xl font-bold text-slate-800" x-text="items.length"></p>
                <p class="text-[9px] font-bold text-slate-400 uppercase mt-1" x-text="key"></p>
            </div>
        </template>
    </div>
</div>
