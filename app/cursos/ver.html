<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Asignatura — Campus Virtual</title>
    <link rel="icon" type="image/x-icon" href="../favicon.ico">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/estilos.css">
    <link rel="stylesheet" href="../css/portal-layout.css">
    <link rel="stylesheet" href="../css/paleta-oficial.css">
    <script src="../js/portal-layout.js" defer></script>
    <style>
        .unit-card{background:#fff;border:1px solid #C8E6C9;border-left:4px solid #007A33;border-radius:10px;padding:16px;margin-bottom:14px}
        .block{margin:10px 0;padding:10px 12px;background:#fbfefb;border:1px solid #e6f4ea;border-radius:8px}
        .block-def{border-left:4px solid #3498db;background:#eaf2f8}
        .block-ejemplo{border-left:4px solid #f1c40f;background:#fef9e7}
        .block-cita{border-left:4px solid #9b59b6;background:#f5eef8;font-style:italic}
        .block-aviso{border-left:4px solid #e74c3c;background:#fdedec}
        .block-pregunta{border-left:4px solid #00B140;background:#E6F4EA}
        .prog{height:8px;background:#e2e8f0;border-radius:5px;overflow:hidden}
        .prog div{height:100%;background:#00B140}
    </style>
</head>
<body>
    <script>if(!sessionStorage.getItem('current_cedula')){location.replace('../index.html');}</script>
    <div class="container-fluid">
        <div class="row portal-layout">
            <nav id="portal-menu" aria-label="Navegación del curso" class="col-md-3 col-lg-2 sidebar px-0" style="position:sticky;top:0;height:100vh;overflow-y:auto;background:#007A33;">
                <div class="p-2">
                    <a href="../dashboard.html" class="d-block text-white text-decoration-none p-2 rounded"><i class="bi bi-speedometer2 me-2"></i>Dashboard</a>
                    <a href="../perfil.html" class="d-block text-white text-decoration-none p-2 rounded"><i class="bi bi-person me-2"></i>Mi Perfil</a>
                </div>
                <div class="px-3 pt-3 pb-2 text-uppercase small fw-bold text-white-50">Unidades</div>
                <div class="px-2" id="menu-units"></div>
            </nav>
            <main class="col-md-9 col-lg-10 content p-4">
                <button type="button" class="portal-menu-toggle" aria-controls="portal-menu" aria-expanded="true">Ocultar menú</button>
                <div id="top-user-bar" class="d-flex justify-content-between align-items-center gap-2 py-2 px-3 mb-3 bg-white rounded-3 shadow-sm border" style="position:sticky;top:0;z-index:10;">
                    <div class="d-flex align-items-center gap-3">
                        <img src="../Materiales_Clases/logo_centuria.png" alt="Centuria" style="height:36px" onerror="this.style.display='none'">
                        <div>
                            <div class="fw-bold" style="color:#007A33;font-size:.85rem">INSTITUTO SUPERIOR CENTURIA</div>
                            <small class="text-muted" id="top-carrera"></small>
                        </div>
                    </div>
                    <div class="text-end">
                        <div id="sb-user" class="fw-bold small" style="color:#007A33"></div>
                        <small id="sb-ced" class="text-muted" style="font-size:.7rem"></small>
                    </div>
                </div>
                <div id="contenido"><p class="text-muted">Cargando…</p></div>
            </main>
        </div>
    </div>
    <script src="../js/api.js?v=12"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const CODIGO = new URLSearchParams(location.search).get('codigo') || '';
        const CED = sessionStorage.getItem('current_cedula') || '';
        const NOM = sessionStorage.getItem('current_nombre') || '';
        const PKEY = 'ctor_prog_' + CODIGO + '_' + CED;
        let DATA = null;

        const G = (o, ...ks) => { for (const k of ks) { if (o && o[k] !== undefined && o[k] !== null && o[k] !== '') return o[k]; } return ''; };
        const esc = s => String(s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

        async function apiGet(accion, params) {
            const q = new URLSearchParams({ action: accion, ...params }).toString();
            try {
                const r = await fetch(CenturiaAPI.baseUrl + 'constructor.php?' + q, {
                    headers: { 'Authorization': 'Bearer ' + CenturiaAPI.getToken() }
                });
                const d = await r.json();
                if (d && (d.ok || d.draft || d.drafts)) return d;
                throw 0;
            } catch (e) {
                const gmap = { get_subject: 'constructor_get_subject' };
                const r = await fetch(GAS_URL + '?' + new URLSearchParams({ action: gmap[accion] || accion, ...params }).toString());
                return r.json();
            }
        }

        function prog() {
            try { return JSON.parse(localStorage.getItem(PKEY) || '{}'); } catch (e) { return {}; }
        }
        function marcarUnidad(id) {
            const p = prog(); p[id] = true;
            try { localStorage.setItem(PKEY, JSON.stringify(p)); } catch (e) {}
            render();
        }

        function renderBlock(b) {
            const tipo = (G(b, 'Tipo', 'tipo') || 'texto').toLowerCase();
            const tit = esc(G(b, 'Titulo', 'titulo'));
            const cont = G(b, 'Contenido', 'contenido'); // HTML del docente
            const cls = { definicion: 'block-def', ejemplo: 'block-ejemplo', cita: 'block-cita', aviso: 'block-aviso', pregunta: 'block-pregunta' }[tipo] || '';
            if (tipo === 'titulo') return `<h4 class="mt-2" style="color:#007A33">${tit || cont}</h4>`;
            if (tipo === 'imagen') return `<div class="block text-center"><img src="${esc(cont)}" style="max-width:100%;border-radius:8px" alt="${tit}"></div>`;
            if (tipo === 'video') return `<div class="block text-center"><a href="${esc(cont)}" target="_blank" rel="noopener"><i class="bi bi-play-circle"></i> Ver video</a></div>`;
            if (tipo === 'enlace' || tipo === 'archivo') return `<div class="block"><a href="${esc(cont)}" target="_blank" rel="noopener"><i class="bi bi-link-45deg"></i> ${tit || cont}</a></div>`;
            return `<div class="block ${cls}">${tit ? `<b>${tit}</b><br>` : ''}${cont}</div>`;
        }

        async function init() {
            document.getElementById('sb-user').textContent = NOM;
            document.getElementById('sb-ced').textContent = 'C.I: ' + CED;
            if (!CODIGO) { document.getElementById('contenido').innerHTML = '<p>Falta ?codigo=</p>'; return; }
            // Buscar el publicado por código
            const r = await apiGet('list_drafts', {});
            const list = r.drafts || [];
            const found = (Array.isArray(list) ? list : []).find(x =>
                String(G(x, 'Codigo', 'codigo')).toUpperCase() === CODIGO.toUpperCase() &&
                String(G(x, 'Estado', 'estado')).toLowerCase() === 'publicado'
            );
            if (!found) {
                // intento directo por id == codigo (compat)
                document.getElementById('contenido').innerHTML = '<div class="alert alert-warning">Asignatura no publicada o inexistente.</div>';
                return;
            }
            const g = await apiGet('get_subject', { id: G(found, 'ID', 'id') });
            if (!g.ok && !g.draft) { document.getElementById('contenido').innerHTML = '<div class="alert alert-danger">No se pudo cargar.</div>'; return; }
            DATA = g.draft ? g : { draft: g.draft || found, program: g.program, units: g.units, activities: g.activities, evaluations: g.evaluations };
            render();
        }

        function render() {
            const dr = DATA.draft;
            document.title = (G(dr, 'Nombre', 'nombre') || 'Asignatura') + ' — Campus Virtual';
            document.getElementById('top-carrera').innerHTML = 'Carrera: <span class="fw-bold">' + esc(G(dr, 'Carrera', 'carrera')) + '</span>';
            const units = DATA.units || [];
            const p = prog();
            const done = units.filter(u => p[G(u, 'ID', 'id')]).length;
            document.getElementById('menu-units').innerHTML = units.map((u, i) =>
                `<a href="#u-${i}" class="d-block text-white text-decoration-none p-2 rounded">Unidad ${esc(G(u, 'Numero', 'numero'))} ${p[G(u, 'ID', 'id')] ? '✓' : ''}</a>`
            ).join('');
            let h = `<span class="badge mb-2" style="background:#00B140">PROGRAMA</span>
                <h1 class="h3 fw-bold" style="color:#007A33">${esc(G(dr, 'Nombre', 'nombre'))}</h1>
                <div class="prog mb-1"><div style="width:${units.length ? Math.round(done / units.length * 100) : 0}%"></div></div>
                <small class="text-muted">${done}/${units.length} unidades</small>`;
            const pr = DATA.program || {};
            if (G(pr, 'Fundamentacion', 'fundamentacion')) h += `<div class="unit-card"><b>Fundamentación</b><p>${G(pr, 'Fundamentacion', 'fundamentacion')}</p></div>`;
            units.forEach((u, i) => {
                const uid = G(u, 'ID', 'id');
                h += `<div class="unit-card" id="u-${i}"><span class="badge mb-2" style="background:#00B140">UNIDAD ${esc(G(u, 'Numero', 'numero'))}</span>
                    <h2 style="color:#007A33;font-size:1.05rem">${esc(G(u, 'Titulo', 'titulo'))}</h2>`;
                if (G(u, 'Resumen', 'resumen')) h += `<p>${G(u, 'Resumen', 'resumen')}</p>`;
                (u.blocks || []).forEach(b => { h += renderBlock(b); });
                h += p[uid]
                    ? `<div class="alert alert-success py-2">✓ Completada</div>`
                    : `<button class="btn btn-success btn-sm" onclick="marcarUnidad('${uid}')"><i class="bi bi-check-circle"></i> Marcar como leída</button>`;
                h += `</div>`;
            });
            const evs = DATA.evaluations || [];
            if (evs.length) {
                h += `<div class="unit-card"><b>Evaluaciones</b>` + evs.map(e =>
                    `<div>• ${esc(G(e, 'Nombre', 'nombre'))} <small class="text-muted">${esc(G(e, 'Tipo', 'tipo'))} · ${G(e, 'Ponderacion', 'ponderacion') || 0}%</small></div>`
                ).join('') + `</div>`;
            }
            document.getElementById('contenido').innerHTML = h;
        }

        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
