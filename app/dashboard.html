<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard — Campus Virtual Centuria</title>
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <style>
        :root {
            --verde: #16813D;
            --verde-dark: #0D5C2A;
            --dorado: #B8941F;
            --azul: #2563EB;
            --rosa: #D94172;
            --naranja: #D97706;
            --texto: #0f172a;
            --texto-sec: #475569;
            --bg: #f1f5f9;
            --card-bg: #ffffff;
            --border: #cbd5e1;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Montserrat', sans-serif;
            min-height: 100vh;
            background: var(--bg);
            color: var(--texto);
        }
        .wrap { max-width: 1100px; margin: 0 auto; padding: 12px 16px 50px; }

        /* Header */
        .hdr {
            display: flex; justify-content: space-between; align-items: center;
            background: var(--card-bg); border: 1px solid var(--border);
            border-radius: 14px; padding: 10px 16px; margin-bottom: 12px;
            box-shadow: 0 1px 3px rgba(0,0,0,.04);
        }
        .hdr-left { display: flex; align-items: center; gap: 12px; }
        .avatar {
            width: 40px; height: 40px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-size: .9rem; font-weight: 700; color: #fff;
        }
        .avatar.alumno { background: linear-gradient(135deg, var(--verde), var(--verde-dark)); }
        .avatar.docente { background: linear-gradient(135deg, var(--azul), #2a5f8f); }
        .avatar.admin { background: linear-gradient(135deg, var(--dorado), #a08530); }
        .avatar.academico { background: linear-gradient(135deg, var(--rosa), #c04070); }
        .avatar.administrador_plataforma { background: linear-gradient(135deg, var(--naranja), #c06020); }
        .avatar.admin_filial { background: linear-gradient(135deg, var(--naranja), #c06020); }
        .hdr-name { font-size: .88rem; font-weight: 700; color: var(--texto); }
        .hdr-sub { font-size: .62rem; font-weight: 500; color: var(--texto-sec); }
        .hdr-right { display: flex; align-items: center; gap: 8px; }
        .badge-rol {
            padding: 5px 12px; border-radius: 20px; font-size: .6rem;
            font-weight: 700; letter-spacing: .5px; text-transform: uppercase;
        }
        .badge-rol.alumno { background: #BBF7D0; color: #14532D; }
        .badge-rol.docente { background: #BFDBFE; color: #1E3A8A; }
        .badge-rol.admin { background: #FEF3C7; color: #92400E; }
        .badge-rol.academico { background: #FBCFE8; color: #831843; }
        .badge-rol.administrador_plataforma { background: #FED7AA; color: #9A3412; }
        .badge-rol.admin_filial { background: #FED7AA; color: #9A3412; }
        .btn-out {
            padding: 6px 12px; border-radius: 8px; font-size: .62rem;
            background: #FEE2E2; color: #991B1B; border: 1px solid #FECACA;
            cursor: pointer; font-family: 'Montserrat'; font-weight: 700;
        }
        .btn-out:hover { background: #FECACA; }

        /* Stats */
        .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 12px; }
        .stat-card {
            background: var(--card-bg); border: 1px solid var(--border);
            border-radius: 12px; padding: 12px; text-align: center;
            box-shadow: 0 1px 3px rgba(0,0,0,.04);
        }
        .stat-icon { width: 34px; height: 34px; border-radius: 10px; display: inline-flex; align-items: center; justify-content: center; font-size: 1rem; margin-bottom: 6px; }
        .stat-icon.green { background: #BBF7D0; color: #16813D; }
        .stat-icon.gold { background: #FEF3C7; color: #B8941F; }
        .stat-icon.blue { background: #BFDBFE; color: #2563EB; }
        .stat-icon.rose { background: #FBCFE8; color: #D94172; }
        .stat-val { font-size: 1.4rem; font-weight: 800; color: var(--texto); }
        .stat-lbl { font-size: .6rem; font-weight: 600; color: var(--texto-sec); letter-spacing: .5px; text-transform: uppercase; }

        /* Section */
        .section {
            background: var(--card-bg); border: 1px solid var(--border);
            border-radius: 12px; padding: 14px; margin-bottom: 10px;
            box-shadow: 0 1px 3px rgba(0,0,0,.04);
        }
        .sec-title {
            font-size: .75rem; font-weight: 700; letter-spacing: .5px;
            text-transform: uppercase; color: var(--texto); margin-bottom: 10px;
            display: flex; align-items: center; gap: 6px;
        }
        .sec-title i { color: var(--dorado); }

        /* Quick Links */
        .links { display: grid; grid-template-columns: repeat(auto-fit, minmax(100px, 1fr)); gap: 8px; }
        .link {
            background: #f8fafc; border: 1px solid var(--border);
            border-radius: 10px; padding: 10px 6px; text-align: center;
            cursor: pointer; transition: .2s; text-decoration: none; color: var(--texto);
        }
        .link:hover { background: #DCFCE7; border-color: var(--verde); transform: translateY(-1px); }
        .link i { font-size: 1.2rem; margin-bottom: 4px; display: block; color: var(--verde); }
        .link span { font-size: .55rem; font-weight: 600; letter-spacing: .3px; text-transform: uppercase; color: var(--texto); }

        /* Subject Card */
        .subj {
            background: #f8fafc; border: 1px solid var(--border);
            border-radius: 10px; padding: 10px 12px; margin-bottom: 6px;
            display: flex; justify-content: space-between; align-items: center;
            transition: .2s;
        }
        .subj:hover { background: #E6F4EA; border-color: var(--verde); }
        .subj-info { flex: 1; }
        .subj-name { font-size: .78rem; font-weight: 600; color: var(--texto); }
        .subj-meta { font-size: .58rem; font-weight: 500; color: var(--texto-sec); }
        .subj-btn {
            padding: 5px 12px; border-radius: 8px; font-size: .6rem;
            background: var(--verde); color: #fff; text-decoration: none;
            font-weight: 700; transition: .2s;
        }
        .subj-btn:hover { background: var(--verde-dark); }

        /* Empty State */
        .empty {
            text-align: center; padding: 24px; color: var(--texto-sec);
        }
        .empty i { font-size: 2rem; margin-bottom: 8px; display: block; color: #94a3b8; }
        .empty p { font-size: .72rem; }

        /* Event */
        .ev {
            background: #f8fafc; border: 1px solid var(--border);
            border-radius: 10px; padding: 10px; margin-bottom: 6px;
            display: flex; gap: 10px; align-items: center;
        }
        .ev-date {
            width: 38px; height: 38px; border-radius: 10px;
            background: linear-gradient(135deg, var(--rosa), var(--naranja));
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            color: #fff; flex-shrink: 0;
        }
        .ev-date .day { font-size: .9rem; font-weight: 800; line-height: 1; }
        .ev-date .month { font-size: .45rem; text-transform: uppercase; letter-spacing: .5px; }
        .ev-info { flex: 1; }
        .ev-title { font-size: .72rem; font-weight: 600; color: var(--texto); }
        .ev-desc { font-size: .58rem; font-weight: 500; color: var(--texto-sec); }
        .ev-tag {
            padding: 3px 8px; border-radius: 8px; font-size: .5rem;
            font-weight: 700; letter-spacing: .3px; text-transform: uppercase;
        }
        .ev-tag.exam { background: #FEE2E2; color: #991B1B; }
        .ev-tag.assignment { background: #FEF3C7; color: #92400E; }
        .ev-tag.meeting { background: #BFDBFE; color: #1E3A8A; }

        /* Footer */
        .footer {
            position: fixed; bottom: 0; left: 0; right: 0;
            text-align: center; padding: 5px 16px; z-index: 10;
            background: var(--card-bg); border-top: 1px solid var(--border);
            font-size: .5rem; font-weight: 500; color: var(--texto-sec);
        }

        /* Print */
        @media print { .footer, .btn-out { display: none; } body { background: #fff; } }
        /* Responsive */
        @media (max-width: 768px) {
            .stats { grid-template-columns: repeat(2, 1fr); }
            .hdr { flex-direction: column; gap: 8px; }
        }
    </style>
</head>
<body>
    <div class="wrap">
        <!-- Header -->
        <div class="hdr">
            <div class="hdr-left">
                <div class="avatar" id="dash-avatar">E</div>
                <div>
                    <div class="hdr-name" id="dash-name">Cargando...</div>
                    <div class="hdr-sub" id="dash-sub">Cargando...</div>
                </div>
            </div>
            <div class="hdr-right">
                <span class="badge-rol" id="dash-badge">-</span>
                <button class="btn-out" onclick="centuriaLogout(true)">
                    <i class="bi bi-box-arrow-right me-1"></i>Salir
                </button>
            </div>
        </div>

        <!-- Stats -->
        <div class="stats">
            <div class="stat-card">
                <div class="stat-icon green"><i class="bi bi-book"></i></div>
                <div class="stat-val" id="stat-courses">0</div>
                <div class="stat-lbl">Asignaturas</div>
            </div>
            <div class="stat-card">
                <div class="stat-icon gold"><i class="bi bi-calendar-event"></i></div>
                <div class="stat-val" id="stat-events">0</div>
                <div class="stat-lbl">Eventos</div>
            </div>
            <div class="stat-card">
                <div class="stat-icon blue"><i class="bi bi-graph-up"></i></div>
                <div class="stat-val" id="stat-promedio">-</div>
                <div class="stat-lbl">Promedio</div>
            </div>
            <div class="stat-card">
                <div class="stat-icon rose"><i class="bi bi-clipboard-check"></i></div>
                <div class="stat-val" id="stat-asistencia">-</div>
                <div class="stat-lbl">Asistencia</div>
            </div>
        </div>

        <!-- Quick Links -->
        <div class="section">
            <div class="sec-title"><i class="bi bi-grid-3x3-gap"></i> Acceso Rápido</div>
            <div class="links" id="dash-links"></div>
        </div>

        <!-- Asignaturas -->
        <div class="section" id="section-courses">
            <div class="sec-title"><i class="bi bi-mortarboard-fill"></i> Mis Asignaturas</div>
            <div id="dash-courses">Cargando...</div>
        </div>

        <!-- Eventos -->
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;">
            <div class="section">
                <div class="sec-title"><i class="bi bi-calendar3"></i> Próximos Eventos</div>
                <div id="dash-calendar">Cargando...</div>
            </div>
            <div class="section">
                <div class="sec-title"><i class="bi bi-exclamation-triangle"></i> En Puerta</div>
                <div id="dash-events">Cargando...</div>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <div class="footer">
        Instituto Superior Centuria — "Formando líderes con tecnología y excelencia" © 2026
    </div>

    <script src="js/api.js?v=7"></script>
    <script src="js/logout.js"></script>
    <script>
        // ═══ ROLE CONFIG ═══
        const roleConfig = {
            alumno: {
                label: 'Alumno',
                links: [
                    { href: 'Materiales_Clases/index.html', icon: 'bi-book', label: 'Materiales' },
                    { href: 'academic/asistencia_presencial.html', icon: 'bi-calendar-check', label: 'Asistencia' },
                    { href: 'libreta.html', icon: 'bi-journal-text', label: 'Libreta' },
                    { href: 'perfil.html', icon: 'bi-person', label: 'Perfil' }
                ]
            },
            docente: {
                label: 'Docente',
                links: [
                    { href: 'docente.html', icon: 'bi-chalkboard', label: 'Panel Docente' },
                    { href: 'Materiales_Clases/index.html', icon: 'bi-book', label: 'Materiales' },
                    { href: 'libreta.html', icon: 'bi-journal-text', label: 'Libreta' },
                    { href: 'perfil.html', icon: 'bi-person', label: 'Perfil' }
                ]
            },
            admin: {
                label: 'Administrador',
                links: [
                    { href: 'admin/index.html', icon: 'bi-gear', label: 'Panel Admin' },
                    { href: 'admin/index.html#usuarios', icon: 'bi-people', label: 'Usuarios' },
                    { href: 'admin/index.html#asignaturas', icon: 'bi-book', label: 'Asignaturas' },
                    { href: 'perfil.html', icon: 'bi-person', label: 'Perfil' }
                ]
            },
            academico: {
                label: 'Acceso Académico',
                links: [
                    { href: 'admin/index.html', icon: 'bi-gear', label: 'Panel Admin' },
                    { href: 'academic/indicadores_por_unidad.html', icon: 'bi-graph-up', label: 'Indicadores' },
                    { href: 'academic/criterios_evaluacion.html', icon: 'bi-clipboard-check', label: 'Criterios' },
                    { href: 'perfil.html', icon: 'bi-person', label: 'Perfil' }
                ]
            },
            administrador_plataforma: {
                label: 'Admin Plataforma',
                links: [
                    { href: 'admin/index.html', icon: 'bi-gear', label: 'Panel Admin' },
                    { href: 'admin/index.html#filiales', icon: 'bi-building', label: 'Filiales' },
                    { href: 'admin/index.html#usuarios', icon: 'bi-people', label: 'Usuarios' },
                    { href: 'perfil.html', icon: 'bi-person', label: 'Perfil' }
                ]
            },
            admin_filial: {
                label: 'Admin Filial',
                links: [
                    { href: 'admin/index.html', icon: 'bi-gear', label: 'Panel Admin' },
                    { href: 'admin/index.html#usuarios', icon: 'bi-people', label: 'Usuarios' },
                    { href: 'perfil.html', icon: 'bi-person', label: 'Perfil' }
                ]
            }
        };

        // ═══ CARGAR DASHBOARD ═══
        async function cargarDashboard() {
            const token = CenturiaAPI.getToken();
            const user = CenturiaAPI.getCurrentUser();
            const cedula = localStorage.getItem('centuria_cedula');

            if (!user && !cedula) { location.href = 'index.html'; return; }

            // Datos del usuario
            const nombre = user ? (user.firstname || 'Estudiante') : (localStorage.getItem('centuria_nombre') || 'Estudiante');
            const apellido = user ? (user.lastname || '') : (localStorage.getItem('centuria_apellido') || '');
            const rol = user ? (user.role || 'alumno') : (localStorage.getItem('centuria_rol') || 'alumno');
            const carrera = user ? (user.carrera || '') : (localStorage.getItem('centuria_carrera') || '');
            const filial = user ? (user.filial || '') : (localStorage.getItem('centuria_filial') || '');
            const cedulaVal = user ? (user.username || cedula || '') : (cedula || '');

            // Render header
            document.getElementById('dash-name').textContent = nombre + ' ' + apellido;
            document.getElementById('dash-sub').textContent = cedulaVal + (carrera ? ' • ' + carrera : '') + (filial ? ' • ' + filial : '');
            document.getElementById('dash-avatar').textContent = (nombre.charAt(0) + apellido.charAt(0)).toUpperCase();
            document.getElementById('dash-avatar').className = 'avatar ' + rol;
            document.getElementById('dash-badge').textContent = roleConfig[rol]?.label || rol;
            document.getElementById('dash-badge').className = 'badge-rol ' + rol;

            // Quick links
            const cfg = roleConfig[rol] || roleConfig.alumno;
            document.getElementById('dash-links').innerHTML = cfg.links.map(l =>
                `<a href="${l.href}" class="link"><i class="bi ${l.icon}"></i><span>${l.label}</span></a>`
            ).join('');

            // ═══ CARGAR ASIGNATURAS SEGÚN ROL ═══
            if (rol === 'docente') {
                await cargarAsignaturasDocente(user, token, cedulaVal);
            } else {
                await cargarAsignaturasGenerales();
            }

            // Cargar eventos
            await cargarEventos(token);
            
            // Cargar notas
            await cargarNotas(token);
        }

        // ═══ ASIGNATURAS DOCENTE — Solo las asignadas ═══
        async function cargarAsignaturasDocente(user, token, cedula) {
            const container = document.getElementById('dash-courses');
            try {
                const userId = user ? (user.id || '') : '';
                let url = CenturiaAPI.baseUrl + 'docente.php?action=my_subjects';
                if (userId) url += '&user_id=' + userId;
                else if (cedula) url += '&cedula=' + cedula;

                const resp = await fetch(url, {
                    headers: token ? { 'Authorization': 'Bearer ' + token } : {}
                });
                const data = await resp.json();

                // Solo mostrar las asignaturas que realmente tiene asignadas
                const subjects = (data.subjects || []).filter(s => {
                    // Verificar que tenga una asignación real en user_roles
                    const assignments = data.assignments || [];
                    return assignments.some(a => a.asignatura === s.codigo && a.rol === 'docente');
                });

                document.getElementById('stat-courses').textContent = subjects.length;

                if (subjects.length === 0) {
                    container.innerHTML = `
                        <div class="empty">
                            <i class="bi bi-inbox"></i>
                            <p><strong>Sin asignaturas asignadas</strong></p>
                            <p style="margin-top:4px;font-size:.55rem;color:#94a3b8;">
                                Tu asignación será visible aquí una vez que el administrador te vincule a una materia.
                            </p>
                        </div>`;
                    return;
                }

                container.innerHTML = subjects.map(s => `
                    <div class="subj" style="border-left:3px solid ${s.color || '#00B140'};">
                        <div class="subj-info">
                            <div class="subj-name">
                                <i class="bi ${s.icono || 'bi-book'}" style="color:${s.color || '#00B140'};margin-right:4px;"></i>
                                ${s.nombre || s.nombre_completo || 'Asignatura'}
                            </div>
                            <div class="subj-meta">${s.codigo || ''} • ${s.carrera || ''} • ${s.semestre || ''}</div>
                        </div>
                        <a href="Materiales_Clases/programa.html?curso=${s.codigo}" class="subj-btn">
                            <i class="bi bi-arrow-right"></i> Ver
                        </a>
                    </div>
                `).join('');
            } catch (e) {
                console.error('Error cargando asignaturas docente:', e);
                container.innerHTML = `<div class="empty"><i class="bi bi-exclamation-circle"></i><p>Error al cargar asignaturas</p></div>`;
            }
        }

        // ═══ ASIGNATURAS GENERALES (alumno/admin/académico) ═══
        async function cargarAsignaturasGenerales() {
            const container = document.getElementById('dash-courses');
            try {
                const resp = await fetch(CenturiaAPI.baseUrl + 'asignaturas.php?action=list');
                const data = await resp.json();
                const courses = (data.items || data.asignaturas || []).filter(c => c.estado !== 'inactivo');
                document.getElementById('stat-courses').textContent = courses.length;

                if (courses.length === 0) {
                    container.innerHTML = `<div class="empty"><i class="bi bi-inbox"></i><p>No hay asignaturas disponibles</p></div>`;
                    return;
                }

                container.innerHTML = courses.slice(0, 6).map(c => `
                    <div class="subj" style="border-left:3px solid ${c.color || '#00B140'};">
                        <div class="subj-info">
                            <div class="subj-name">
                                <i class="bi ${c.icono || 'bi-book'}" style="color:${c.color || '#00B140'};margin-right:4px;"></i>
                                ${c.nombre || 'Asignatura'}
                            </div>
                            <div class="subj-meta">${c.codigo || ''} • ${c.carrera || ''} • ${c.semestre || ''}</div>
                        </div>
                        <a href="Materiales_Clases/programa.html?curso=${c.codigo}" class="subj-btn">
                            <i class="bi bi-arrow-right"></i> Ver
                        </a>
                    </div>
                `).join('');
            } catch (e) {
                container.innerHTML = `<div class="empty"><i class="bi bi-inbox"></i><p>No hay asignaturas</p></div>`;
            }
        }

        // ═══ EVENTOS ═══
        async function cargarEventos(token) {
            const container = document.getElementById('dash-calendar');
            try {
                const resp = await fetch(CenturiaAPI.baseUrl + 'calendar.php?action=list', {
                    headers: token ? { 'Authorization': 'Bearer ' + token } : {}
                });
                const data = await resp.json();
                const events = data.data || data.events || [];
                const now = new Date();
                const upcoming = events.filter(e => new Date(e.fecha || e.date) >= now)
                    .sort((a, b) => new Date(a.fecha || a.date) - new Date(b.fecha || b.date));
                document.getElementById('stat-events').textContent = upcoming.length;

                if (upcoming.length === 0) {
                    container.innerHTML = `<div class="empty"><i class="bi bi-calendar-x"></i><p>No hay eventos próximos</p></div>`;
                    return;
                }

                container.innerHTML = upcoming.slice(0, 4).map(e => {
                    const d = new Date(e.fecha || e.date);
                    return `
                    <div class="ev">
                        <div class="ev-date"><div class="day">${d.getDate()}</div><div class="month">${d.toLocaleString('es',{month:'short'})}</div></div>
                        <div class="ev-info"><div class="ev-title">${e.titulo || e.title || 'Evento'}</div><div class="ev-desc">${e.descripcion || ''}</div></div>
                        <span class="ev-tag ${e.tipo || 'meeting'}">${e.tipo || 'evento'}</span>
                    </div>`;
                }).join('');
            } catch (e) {
                container.innerHTML = `<div class="empty"><i class="bi bi-calendar-x"></i><p>Sin eventos</p></div>`;
            }
        }

        // ═══ NOTAS ═══
        async function cargarNotas(token) {
            try {
                const resp = await fetch(CenturiaAPI.baseUrl + 'grades.php?action=list', {
                    headers: token ? { 'Authorization': 'Bearer ' + token } : {}
                });
                const data = await resp.json();
                const grades = data.data || [];
                if (grades.length === 0) return;
                const avg = (grades.reduce((s, g) => s + (g.score || 0), 0) / grades.length).toFixed(1);
                document.getElementById('stat-promedio').textContent = avg;
                const asist = Math.round((grades.filter(g => g.component === 'asistencia' || g.estado === 'presente').length / grades.length) * 100);
                document.getElementById('stat-asistencia').textContent = asist + '%';
            } catch (e) {}
        }

        // ═══ INIT ═══
        document.addEventListener('DOMContentLoaded', cargarDashboard);
    </script>
</body>
</html>
