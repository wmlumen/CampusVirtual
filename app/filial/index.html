<!DOCTYPE html>
<html lang="es">
<head>
    <script src="../js/session-guard.js?v=5"></script>
    <script>CenturiaSession.protect({allowedRoles:['admin_filial','admin','administrador_plataforma'], currentRolePage:'admin'});</script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Filial — Centuria</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body{font-family:'Montserrat',sans-serif;background:#f8fafc;color:#1e293b}
        .topbar{background:#0d2c16;color:#fff;padding:12px 20px;display:flex;justify-content:space-between;align-items:center}
        .wrap{max-width:1000px;margin:0 auto;padding:20px}
        .cardx{background:#fff;border:1px solid #e2e8f0;border-radius:16px;padding:20px;margin-bottom:16px;box-shadow:0 4px 12px rgba(0,0,0,.06)}
    </style>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js" onerror="console.error('Firebase app-compat failed to load')"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js" onerror="console.error('Firebase firestore-compat failed to load')"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js" onerror="console.error('Firebase auth-compat failed to load')"></script>
    <script src="../js/api.js?v=21"></script>
</head>
<body>
    <div class="topbar">
        <div><i class="bi bi-geo-alt-fill me-2" style="color:#d4a843"></i> Panel Filial — Centuria</div>
        <div><a href="../dashboard-admin.html" class="btn btn-sm btn-outline-light">Volver Admin</a> <a href="../index.html" class="btn btn-sm btn-outline-light" onclick="sessionStorage.clear()">Salir</a></div>
    </div>
    <div class="wrap">
        <div class="cardx">
            <h5><i class="bi bi-building me-2" style="color:#16813D"></i>Gestión de Filiales — <small id="filial-rol" class="text-muted"></small></h5>
            <div id="filial-lista" class="mt-3">Cargando...</div>
        </div>
        <div class="cardx">
            <h6><i class="bi bi-plus-circle me-2"></i>Crear / Editar Filial</h6>
            <div class="row g-2">
                <div class="col-md-4"><input id="f-nombre" class="form-control" placeholder="Nombre filial"></div>
                <div class="col-md-3"><input id="f-codigo" class="form-control" placeholder="Código"></div>
                <div class="col-md-5"><input id="f-direccion" class="form-control" placeholder="Dirección"></div>
            </div>
            <button class="btn btn-success mt-3" onclick="crearFilial()"><i class="bi bi-check-circle me-1"></i>Guardar Filial</button>
            <button class="btn btn-outline-secondary mt-3" onclick="cargarFiliales()">Actualizar</button>
        </div>
        <div class="cardx">
            <h6><i class="bi bi-people me-2"></i>Administradores por Filial</h6>
            <div id="admins-filial">Cargando...</div>
        </div>
    </div>
<script>
document.getElementById('filial-rol').textContent = (CenturiaSession.getRole()||'').toUpperCase() + ' — ' + (CenturiaSession.getUser()?.nombre||'');
async function cargarFiliales(){
  const box=document.getElementById('filial-lista');
  try{
    const r=await CenturiaAPI.filiales.list();
    const list=r.filiales||r.data||[];
    if(!list.length){box.innerHTML='<p class="text-muted">No hay filiales registradas.</p>';return;}
    box.innerHTML='<table class="table table-sm"><thead><tr><th>Código</th><th>Nombre</th><th>Dirección</th></tr></thead><tbody>'+list.map(f=>`<tr><td><b>${f.codigo||''}</b></td><td>${f.nombre||''}</td><td>${f.direccion||''}</td></tr>`).join('')+'</tbody></table>';
  }catch(e){ box.innerHTML='<p class="text-danger">Error: '+e.message+'</p>';}
}
async function cargarAdmins(){
  const box=document.getElementById('admins-filial');
  try{
    const r=await CenturiaAPI.filiales.adminsByFilial();
    const list=r.admins||[];
    if(!list.length){box.innerHTML='<p class="text-muted">Sin administradores asignados.</p>';return;}
    box.innerHTML='<ul class="list-group">'+list.map(a=>`<li class="list-group-item d-flex justify-content-between"><span>${a.filial||''}</span><b>${a.admin||''}</b></li>`).join('')+'</ul>';
  }catch(e){ box.innerHTML='<p class="text-danger">Error</p>';}
}
async function crearFilial(){
  const nombre=document.getElementById('f-nombre').value.trim();
  const codigo=document.getElementById('f-codigo').value.trim().toUpperCase();
  const direccion=document.getElementById('f-direccion').value.trim();
  if(!nombre||!codigo){alert('Nombre y código requeridos');return;}
  try{
    const r=await CenturiaAPI.filiales.crear({nombre,codigo,direccion});
    if(r.ok||r.status==='Éxito'){ alert('Filial creada'); document.getElementById('f-nombre').value='';document.getElementById('f-codigo').value='';document.getElementById('f-direccion').value=''; cargarFiliales();}
    else alert('Error: '+(r.error||r.mensaje));
  }catch(e){ alert('Error de conexión');}
}
cargarFiliales(); cargarAdmins();
</script>
</body>
</html>
