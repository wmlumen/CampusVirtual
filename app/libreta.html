<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Libreta de Calificaciones — Campus Virtual Centuria</title>
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@200;300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --verde-oscuro: #0d2c16;
            --verde-medio: #16813D;
            --verde-claro: #e8f5ec;
            --dorado: #d4a843;
            --blanco: #ffffff;
            --rosa: #D94172;
            --azul: #2563EB;
            --naranja: #D97706;
            --rojo: #ef5350;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Montserrat', sans-serif;
            min-height: 100vh;
            color: var(--blanco);
            position: relative;
            overflow-x: hidden;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
        }
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background:
                radial-gradient(ellipse at 20% 50%, rgba(22,129,61,.12) 0%, transparent 60%),
                linear-gradient(160deg, #060f09 0%, #0d2c16 35%, #0f3820 65%, #060f09 100%);
            z-index: -2;
        }
        body::after {
            content: '';
            position: fixed;
            inset: 0;
            background: url("data:image/svg+xml,%3Csvg width='60' height='60' xmlns='http://www.w3.org/2000/svg'%3E%3Ccircle cx='30' cy='30' r='1' fill='rgba(255,255,255,.03)'/%3E%3C/svg%3E");
            z-index: -1;
        }
        .lib-wrapper {
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
            animation: fadeInUp .8s cubic-bezier(.16,1,.3,1);
        }
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .lib-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 24px;
            background: rgba(255,255,255,.07);
            border: 1px solid rgba(255,255,255,.12);
            border-radius: 20px;
            backdrop-filter: blur(20px);
            margin-bottom: 20px;
        }
        .lib-header-left { display: flex; align-items: center; gap: 16px; }
        .lib-avatar {
            width: 56px; height: 56px; border-radius: 50%;
            background: linear-gradient(135deg, var(--verde-medio), var(--verde-oscuro));
            display: flex; align-items: center; justify-content: center;
            font-size: 1.3rem; font-weight: 700; color: var(--blanco);
            border: 2px solid var(--dorado);
        }
        .lib-header-name { font-size: 1.1rem; font-weight: 700; }
        .lib-header-sub { font-size: .7rem; color: var(--dorado); letter-spacing: 1px; }
        .lib-btn {
            padding: 8px 16px; border-radius: 12px; font-size: .7rem;
            font-family: 'Montserrat'; font-weight: 600; cursor: pointer;
            border: none; transition: .2s;
        }
        .lib-btn-print { background: rgba(197,165,90,.2); color: var(--dorado); border: 1px solid rgba(197,165,90,.3); }
        .lib-btn-print:hover { background: rgba(197,165,90,.3); }
        .lib-btn-home { background: rgba(255,255,255,.08); color: rgba(255,255,255,.6); border: 1px solid rgba(255,255,255,.15); }
        .lib-btn-home:hover { background: rgba(255,255,255,.12); color: var(--blanco); }

        /* ── GPA Summary ── */
        .gpa-bar {
            background: rgba(255,255,255,.07);
            border: 1px solid rgba(255,255,255,.12);
            border-radius: 18px;
            padding: 20px;
            backdrop-filter: blur(20px);
            margin-bottom: 20px;
            display: flex;
            justify-content: space-around;
            align-items: center;
            flex-wrap: wrap;
            gap: 16px;
        }
        .gpa-item { text-align: center; }
        .gpa-value { font-size: 2rem; font-weight: 800; }
        .gpa-label { font-size: .6rem; color: rgba(255,255,255,.5); letter-spacing: 1px; text-transform: uppercase; }
        .gpa-excellent { color: var(--verde-medio); }
        .gpa-good { color: var(--dorado); }
        .gpa-fair { color: var(--naranja); }
        .gpa-poor { color: var(--rojo); }

        /* ── Subject Table ── */
        .lib-section {
            background: rgba(255,255,255,.07);
            border: 1px solid rgba(255,255,255,.12);
            border-radius: 18px;
            padding: 20px;
            backdrop-filter: blur(20px);
            margin-bottom: 16px;
        }
        .lib-section-title {
            font-size: .8rem; font-weight: 700; letter-spacing: 1px;
            text-transform: uppercase; margin-bottom: 16px;
            display: flex; align-items: center; gap: 8px;
        }
        .lib-section-title i { color: var(--dorado); }

        .lib-table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0 4px;
            margin-bottom: 0;
        }
        .lib-table thead th {
            background: rgba(0,122,51,.3);
            color: var(--dorado);
            font-size: .6rem;
            font-weight: 700;
            letter-spacing: 1px;
            text-transform: uppercase;
            padding: 10px 12px;
            border: none;
        }
        .lib-table thead th:first-child { border-radius: 10px 0 0 10px; }
        .lib-table thead th:last-child { border-radius: 0 10px 10px 0; }
        .lib-table tbody td {
            background: rgba(255,255,255,.04);
            padding: 10px 12px;
            font-size: .75rem;
            border: none;
            color: var(--blanco);
        }
        .lib-table tbody tr:first-child td:first-child { border-radius: 0 0 0 10px; }
        .lib-table tbody tr:last-child td:first-child { border-radius: 0 0 0 10px; }
        .lib-table tbody tr:first-child td:last-child { border-radius: 0 0 10px 0; }
        .lib-table tbody tr:last-child td:last-child { border-radius: 0 0 10px 0; }
        .lib-table tbody tr:hover td { background: rgba(255,255,255,.08); }

        .grade-cell { font-weight: 700; text-align: center; }
        .grade-a { color: var(--verde-medio); }
        .grade-b { color: var(--dorado); }
        .grade-c { color: var(--naranja); }
        .grade-f { color: var(--rojo); }
        .grade-pending { color: rgba(255,255,255,.3); }

        .subject-badge {
            display: inline-block;
            padding: 3px 10px;
            border-radius: 10px;
            font-size: .6rem;
            font-weight: 600;
            letter-spacing: .5px;
        }
        .subject-badge.active { background: rgba(0,177,64,.2); color: var(--verde-medio); }
        .subject-badge.inactive { background: rgba(255,255,255,.08); color: rgba(255,255,255,.3); }

        /* ── Progress Bar ── */
        .lib-progress {
            width: 80px;
        }
        .lib-progress .progress { height: 6px; }
        .lib-progress .progress-text { font-size: .55rem; color: var(--dorado); text-align: right; margin-top: 2px; }

        /* ── Career Tabs ── */
        .lib-tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 16px;
            flex-wrap: wrap;
        }
        .lib-tab {
            padding: 8px 16px;
            border-radius: 12px;
            font-size: .7rem;
            font-weight: 600;
            letter-spacing: .5px;
            cursor: pointer;
            background: rgba(255,255,255,.05);
            color: rgba(255,255,255,.5);
            border: 1px solid rgba(255,255,255,.1);
            transition: .2s;
            font-family: 'Montserrat';
        }
        .lib-tab:hover { background: rgba(255,255,255,.08); color: var(--blanco); }
        .lib-tab.active { background: rgba(0,177,64,.2); color: var(--verde-medio); border-color: rgba(0,177,64,.3); }

        /* ── Summary Cards ── */
        .lib-summary-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 12px;
            margin-bottom: 16px;
        }
        .lib-summary-card {
            background: rgba(255,255,255,.05);
            border: 1px solid rgba(255,255,255,.08);
            border-radius: 14px;
            padding: 16px;
            text-align: center;
        }
        .lib-summary-card .value { font-size: 1.4rem; font-weight: 800; }
        .lib-summary-card .label { font-size: .6rem; color: rgba(255,255,255,.4); letter-spacing: 1px; text-transform: uppercase; margin-top: 4px; }

        /* ── Footer ── */
        .premium-footer-wrapper {
            position: fixed; bottom: 0; left: 0; right: 0;
            text-align: center; padding: 6px 20px; z-index: 10;
            background: rgba(0,61,25,.9); backdrop-filter: blur(8px);
            border-top: 1px solid rgba(255,255,255,.08); height: 36px;
        }
        .premium-footer-wrapper .premium-footer { margin-top: 0; padding: 0; line-height: 1.4; }
        .premium-footer-wrapper .premium-footer .institution { font-size: .55rem; margin-bottom: 0; }
        .premium-footer-wrapper .premium-footer .motto { font-size: .5rem; }
        .premium-footer-wrapper .premium-footer .year { font-size: .45rem; margin-top: 0; }
        .lib-wrapper { padding-bottom: 44px; }

        /* ── Print ── */
        @media print {
            body { background: white !important; color: black !important; }
            body::before, body::after { display: none; }
            .lib-header, .lib-section, .gpa-bar { border: 1px solid #ccc; background: white; box-shadow: none; }
            .lib-header, .lib-section { color: black; }
            .lib-table thead th { background: #007A33 !important; color: white !important; }
            .lib-table tbody td { background: #f9f9f9 !important; color: black !important; }
            .lib-btn { display: none; }
            .premium-footer-wrapper { display: none; }
            .lib-wrapper { padding-bottom: 0; }
            .grade-a { color: #007A33 !important; }
            .grade-b { color: #C5A55A !important; }
            .grade-c { color: #FF8C42 !important; }
            .grade-f { color: #ef5350 !important; }
        }

        /* ── Responsive ── */
        @media (max-width: 768px) {
            .lib-wrapper { padding: 12px; }
            .lib-header { flex-direction: column; gap: 12px; }
            .lib-header-right { width: 100%; justify-content: flex-end; }
            .gpa-bar { flex-direction: column; }
            .lib-table { font-size: .65rem; }
        }
    </style>
</head>
<body>
    <div class="lib-wrapper">
        <!-- ═══ Header ═══ -->
        <div class="lib-header">
            <div class="lib-header-left">
                <div class="lib-avatar" id="lib-avatar">E</div>
                <div>
                    <div class="lib-header-name" id="lib-name">Libreta de Calificaciones</div>
                    <div class="lib-header-sub" id="lib-sub">Cargando...</div>
                </div>
            </div>
            <div style="display:flex;gap:8px;">
                <button class="lib-btn lib-btn-print" onclick="window.print()">
                    <i class="bi bi-printer me-1"></i>Imprimir
                </button>
                <button class="lib-btn lib-btn-home" onclick="location.href='dashboard.html'">
                    <i class="bi bi-grid-3x3-gap me-1"></i>Dashboard
                </button>
            </div>
        </div>

        <!-- ═══ GPA Summary ═══ -->
        <div class="gpa-bar">
            <div class="gpa-item">
                <div class="gpa-value gpa-excellent" id="gpa-general">-</div>
                <div class="gpa-label">Promedio General</div>
            </div>
            <div class="gpa-item">
                <div class="gpa-value" id="gpa-asistencia" style="color:var(--azul);">-</div>
                <div class="gpa-label">Asistencia %</div>
            </div>
            <div class="gpa-item">
                <div class="gpa-value" id="gpa-courses" style="color:var(--dorado);">0</div>
                <div class="gpa-label">Asignaturas</div>
            </div>
            <div class="gpa-item">
                <div class="gpa-value" id="gpa-approved" style="color:var(--verde-medio);">0</div>
                <div class="gpa-label">Aprobadas</div>
            </div>
        </div>

        <!-- ═══ Career Tabs ═══ -->
        <div class="lib-tabs" id="lib-tabs">
            <div class="lib-tab active" data-carrera="todas" onclick="filterCareer('todas')">Todas</div>
        </div>

        <!-- ═══ Subject Tables ═══ -->
        <div id="lib-content">
            <div class="lib-section">
                <div class="lib-section-title"><i class="bi bi-hourglass-split"></i> Cargando calificaciones...</div>
                <div style="text-align:center;padding:40px;color:rgba(255,255,255,.3);">
                    <i class="bi bi-hourglass" style="font-size:2rem;"></i>
                </div>
            </div>
        </div>
    </div>

    <!-- ═══ Footer ═══ -->
    <div class="premium-footer-wrapper">
        <div class="premium-footer">
            <p class="institution">Instituto Superior Centuria</p>
            <p class="motto">"Formando líderes con tecnología y excelencia"</p>
            <p class="year">© 2026 — Sistema Académico Digital v2.0</p>
        </div>
    </div>

    <script src="js/api.js?v=11"></script>
    <script src="js/logout.js?v=2"></script>
    <script>
        // ═══ DATOS DE ASIGNATURAS POR CARRERA ═══
        const carreraData = {
            'Administración de Empresas': {
                icono: 'bi-briefcase',
                asignaturas: [
                    { codigo: 'ADE18', nombre: 'TIC - Tecnología de la Información y Comunicación', creditos: 6 },
                    { codigo: 'ADE19', nombre: 'Contabilidad General', creditos: 5 },
                    { codigo: 'ADE20', nombre: 'Administración y Gestión Pública', creditos: 5 },
                    { codigo: 'ADE21', nombre: 'Logística y Comercio Internacional', creditos: 4 },
                    { codigo: 'ADE22', nombre: 'Dirección de Empresas', creditos: 4 }
                ]
            },
            'Contabilidad': {
                icono: 'bi-calculator',
                asignaturas: [
                    { codigo: 'CON18', nombre: 'Contabilidad General', creditos: 6 },
                    { codigo: 'CON19', nombre: 'Contabilidad Costera', creditos: 5 },
                    { codigo: 'CON20', nombre: 'Auditoría Financiera', creditos: 5 },
                    { codigo: 'CON21', nombre: 'Gestión Tributaria', creditos: 4 },
                    { codigo: 'CON22', nombre: 'Contabilidad Avanzada', creditos: 4 }
                ]
            },
            'Ingeniería Comercial': {
                icono: 'bi-circuit',
                asignaturas: [
                    { codigo: 'ING18', nombre: 'Matemáticas Aplicadas', creditos: 6 },
                    { codigo: 'ING19', nombre: 'Estadística Empresarial', creditos: 5 },
                    { codigo: 'ING20', nombre: 'Investigación de Operaciones', creditos: 5 },
                    { codigo: 'ING21', nombre: 'Finanzas Corporativas', creditos: 4 },
                    { codigo: 'ING22', nombre: 'Marketing Digital', creditos: 4 }
                ]
            },
            'Administración Aduanera': {
                icono: 'bi-truck',
                asignaturas: [
                    { codigo: 'ADU18', nombre: 'Derecho Aduanero', creditos: 6 },
                    { codigo: 'ADU19', nombre: 'Logística Internacional', creditos: 5 },
                    { codigo: 'ADU20', nombre: 'Tributación Aduanera', creditos: 5 },
                    { codigo: 'ADU21', nombre: 'Comercio Exterior', creditos: 4 },
                    { codigo: 'ADU22', nombre: 'Gestión Portuaria', creditos: 4 }
                ]
            },
            'Administración y Gestión Pública': {
                icono: 'bi-building',
                asignaturas: [
                    { codigo: 'AGP18', nombre: 'Administración Pública', creditos: 6 },
                    { codigo: 'AGP19', nombre: 'Derecho Administrativo', creditos: 5 },
                    { codigo: 'AGP20', nombre: 'Gestión Municipal', creditos: 5 },
                    { codigo: 'AGP21', nombre: 'Presupuesto Público', creditos: 4 },
                    { codigo: 'AGP22', nombre: 'Políticas Públicas', creditos: 4 }
                ]
            },
            'Ciencias Sociales': {
                icono: 'bi-people',
                asignaturas: [
                    { codigo: 'CS18', nombre: 'Sociología General', creditos: 6 },
                    { codigo: 'CS19', nombre: 'Antropología Social', creditos: 5 },
                    { codigo: 'CS20', nombre: 'Ciencia Política', creditos: 5 },
                    { codigo: 'CS21', nombre: 'Economía Social', creditos: 4 },
                    { codigo: 'CS22', nombre: 'Metodología de Investigación', creditos: 4 }
                ]
            }
        };

        // ═══ CARGAR LIBRETA ═══
        async function cargarLibreta() {
            try {
                const token = CenturiaAPI.getToken();
                const user = CenturiaAPI.getCurrentUser();
                
                if (!user) {
                    const cedula = sessionStorage.getItem('current_cedula') || localStorage.getItem('centuria_cedula');
                    if (!cedula) { location.href = 'index.html'; return; }
                    await cargarDatosLocal(cedula);
                    return;
                }

                await cargarDatosAPI(user, token);
            } catch(e) {
                console.error('Error:', e);
                const cedula = sessionStorage.getItem('current_cedula') || localStorage.getItem('centuria_cedula');
                if (cedula) await cargarDatosLocal(cedula);
            }
        }

        async function cargarDatosAPI(user, token) {
            const nombre = user.firstname || 'Estudiante';
            const apellido = user.lastname || '';
            const cedula = user.username || '';
            const carrera = user.carrera || 'No asignada';
            const grado = user.grado || '';

            document.getElementById('lib-name').textContent = nombre + ' ' + apellido;
            document.getElementById('lib-sub').textContent = cedula + ' • ' + carrera + ' • ' + grado;
            document.getElementById('lib-avatar').textContent = nombre.charAt(0) + apellido.charAt(0);

            // Load grades
            let grades = [];
            try {
                const resp = await fetch(CenturiaAPI.baseUrl + 'grades.php?action=list', {
                    headers: { 'Authorization': 'Bearer ' + token }
                });
                const data = await resp.json();
                if (data.success && data.data) grades = data.data;
            } catch(e) {}

            // Load courses
            let courses = [];
            try {
                const resp = await fetch(CenturiaAPI.baseUrl + 'courses.php?action=list', {
                    headers: { 'Authorization': 'Bearer ' + token }
                });
                const data = await resp.json();
                if (data.success && data.data) courses = data.data;
            } catch(e) {}

            // Load attendance
            let attendance = [];
            try {
                const resp = await fetch(CenturiaAPI.baseUrl + 'attendance.php?action=list', {
                    headers: { 'Authorization': 'Bearer ' + token }
                });
                const data = await resp.json();
                if (data.success && data.data) attendance = data.data;
            } catch(e) {}

            renderLibreta(carrera, grades, courses, attendance);
        }

        async function cargarDatosLocal(cedula) {
            const nombre = localStorage.getItem('centuria_nombre') || 'Estudiante';
            const apellido = localStorage.getItem('centuria_apellido') || '';
            const carrera = localStorage.getItem('centuria_carrera') || 'Administración de Empresas';
            const grado = localStorage.getItem('centuria_grado') || '';

            document.getElementById('lib-name').textContent = nombre + ' ' + apellido;
            document.getElementById('lib-sub').textContent = cedula + ' • ' + carrera + ' • ' + grado;
            document.getElementById('lib-avatar').textContent = nombre.charAt(0) + apellido.charAt(0);

            renderLibretaLocal(carrera);
        }

        // ═══ RENDER LIBRETA ═══
        function renderLibreta(carrera, grades, courses, attendance) {
            const container = document.getElementById('lib-content');
            const tabsContainer = document.getElementById('lib-tabs');

            // Get all careers from data
            const carreras = Object.keys(carreraData);
            
            // Add career tabs
            tabsContainer.innerHTML = '<div class="lib-tab active" data-carrera="todas" onclick="filterCareer(\'todas\')">Todas</div>' +
                carreras.map(c => `<div class="lib-tab" data-carrera="${c}" onclick="filterCareer('${c}')">${c}</div>`).join('');

            // Calculate stats
            const allGrades = grades || [];
            const totalGrades = allGrades.length;
            const approved = allGrades.filter(g => (g.score || 0) >= 70).length;
            const avgGrade = totalGrades > 0 ? (allGrades.reduce((s,g) => s + (g.score || 0), 0) / totalGrades).toFixed(1) : '-';
            const attendanceRate = attendance && attendance.length > 0 ? Math.round((attendance.filter(a => a.estado === 'presente').length / attendance.length) * 100) : '-';

            document.getElementById('gpa-general').textContent = avgGrade;
            document.getElementById('gpa-asistencia').textContent = attendanceRate + '%';
            document.getElementById('gpa-courses').textContent = courses.length;
            document.getElementById('gpa-approved').textContent = approved;

            // Render all subjects
            renderAllSubjects(container, carrera, grades, courses, attendance);
        }

        function renderAllSubjects(container, carreraFilter, grades, courses, attendance) {
            let html = '';
            const carreras = carreraFilter === 'todas' ? Object.keys(carreraData) : [carreraFilter];

            carreras.forEach(carrera => {
                const data = carreraData[carrera];
                if (!data) return;

                html += `
                <div class="lib-section">
                    <div class="lib-section-title">
                        <i class="bi ${data.icono}"></i> ${carrera}
                        <span style="font-size:.6rem;color:rgba(255,255,255,.3);margin-left:8px;">(${data.asignaturas.length} asignaturas)</span>
                    </div>
                    <div style="overflow-x:auto;">
                    <table class="lib-table">
                        <thead>
                            <tr>
                                <th>Asignatura</th>
                                <th>Créditos</th>
                                <th>Asist.</th>
                                <th>Parcial 1</th>
                                <th>Parcial 2</th>
                                <th>Final</th>
                                <th>Promedio</th>
                                <th>Estado</th>
                                <th>Progreso</th>
                            </tr>
                        </thead>
                        <tbody>`;

                data.asignaturas.forEach(asig => {
                    const asigGrades = grades.filter(g => (g.asignatura || g.subject || '').includes(asig.nombre.split(' ')[0]) || (g.curso_id || '').includes(asig.codigo));
                    const asistencia = attendance.filter(a => (a.curso_id || a.asignatura || '').includes(asig.codigo));
                    
                    const asistenciaPct = asistencia.length > 0 ? Math.round(asistencia.filter(a => a.estado === 'presente').length / asistencia.length * 100) : '-';
                    const parcial1 = asigGrades.find(g => g.component === 'parcial1' || g.component === 'Parcial 1')?.score || '-';
                    const parcial2 = asigGrades.find(g => g.component === 'parcial2' || g.component === 'Parcial 2')?.score || '-';
                    const final = asigGrades.find(g => g.component === 'final' || g.component === 'Final')?.score || '-';
                    
                    const avg = (parcial1 !== '-' && parcial2 !== '-' && final !== '-') 
                        ? ((parcial1 + parcial2 + final) / 3).toFixed(1) 
                        : '-';
                    
                    const estado = avg !== '-' ? (avg >= 70 ? 'Aprobado' : avg >= 50 ? 'Recuperación' : 'Reprobado') : 'Pendiente';
                    const estadoClass = avg !== '-' ? (avg >= 70 ? 'grade-a' : avg >= 50 ? 'grade-c' : 'grade-f') : 'grade-pending';
                    const progressPct = avg !== '-' ? Math.min(avg, 100) : 0;

                    html += `
                        <tr>
                            <td><strong>${asig.nombre}</strong><br><span style="font-size:.6rem;color:rgba(255,255,255,.4);">${asig.codigo}</span></td>
                            <td style="text-align:center;">${asig.creditos}</td>
                            <td class="grade-cell ${asistenciaPct !== '-' && asistenciaPct >= 80 ? 'grade-a' : asistenciaPct !== '-' && asistenciaPct >= 70 ? 'grade-b' : 'grade-c'}">${asistenciaPct !== '-' ? asistenciaPct + '%' : '-'}</td>
                            <td class="grade-cell ${parcial1 !== '-' ? getGradeClass(parcial1) : 'grade-pending'}">${parcial1 !== '-' ? parcial1 : '-'}</td>
                            <td class="grade-cell ${parcial2 !== '-' ? getGradeClass(parcial2) : 'grade-pending'}">${parcial2 !== '-' ? parcial2 : '-'}</td>
                            <td class="grade-cell ${final !== '-' ? getGradeClass(final) : 'grade-pending'}">${final !== '-' ? final : '-'}</td>
                            <td class="grade-cell ${avg !== '-' ? getGradeClass(avg) : 'grade-pending'}" style="font-size:.85rem;">${avg !== '-' ? avg : '-'}</td>
                            <td><span class="subject-badge ${avg !== '-' ? (avg >= 70 ? 'active' : '') : ''}" style="${avg === '-' ? 'background:rgba(255,255,255,.05);color:rgba(255,255,255,.3);' : ''}">${estado}</span></td>
                            <td>
                                <div class="lib-progress">
                                    <div class="progress" style="height:6px;">
                                        <div class="progress-bar" style="width:${progressPct}%;background:${avg >= 70 ? 'var(--verde-medio)' : avg >= 50 ? 'var(--dorado)' : 'var(--rojo)'};"></div>
                                    </div>
                                    <div class="progress-text">${progressPct}%</div>
                                </div>
                            </td>
                        </tr>`;
                });

                html += `
                        </tbody>
                    </table>
                    </div>
                </div>`;
            });

            container.innerHTML = html;
        }

        function renderLibretaLocal(carrera) {
            const container = document.getElementById('lib-content');
            const tabsContainer = document.getElementById('lib-tabs');
            const carreras = Object.keys(carreraData);

            tabsContainer.innerHTML = '<div class="lib-tab active" data-carrera="todas" onclick="filterCareer(\'todas\')">Todas</div>' +
                carreras.map(c => `<div class="lib-tab" data-carrera="${c}" onclick="filterCareer('${c}')">${c}</div>`).join('');

            let html = '';
            carreras.forEach(carreraName => {
                const data = carreraData[carreraName];
                if (!data) return;

                html += `
                <div class="lib-section">
                    <div class="lib-section-title">
                        <i class="bi ${data.icono}"></i> ${carreraName}
                    </div>
                    <div style="overflow-x:auto;">
                    <table class="lib-table">
                        <thead>
                            <tr>
                                <th>Asignatura</th>
                                <th>Créditos</th>
                                <th>Asist.</th>
                                <th>Parcial 1</th>
                                <th>Parcial 2</th>
                                <th>Final</th>
                                <th>Promedio</th>
                                <th>Estado</th>
                                <th>Progreso</th>
                            </tr>
                        </thead>
                        <tbody>`;

                data.asignaturas.forEach(asig => {
                    html += `
                        <tr>
                            <td><strong>${asig.nombre}</strong><br><span style="font-size:.6rem;color:rgba(255,255,255,.4);">${asig.codigo}</span></td>
                            <td style="text-align:center;">${asig.creditos}</td>
                            <td class="grade-cell grade-pending">-</td>
                            <td class="grade-cell grade-pending">-</td>
                            <td class="grade-cell grade-pending">-</td>
                            <td class="grade-cell grade-pending">-</td>
                            <td class="grade-cell grade-pending">-</td>
                            <td><span class="subject-badge" style="background:rgba(255,255,255,.05);color:rgba(255,255,255,.3);">Pendiente</span></td>
                            <td><div class="lib-progress"><div class="progress" style="height:6px;"><div class="progress-bar" style="width:0%;"></div></div><div class="progress-text">0%</div></div></td>
                        </tr>`;
                });

                html += `
                        </tbody>
                    </table>
                    </div>
                </div>`;
            });

            container.innerHTML = html;
        }

        function filterCareer(carrera) {
            document.querySelectorAll('.lib-tab').forEach(t => t.classList.remove('active'));
            document.querySelector(`.lib-tab[data-carrera="${carrera}"]`).classList.add('active');
            
            const grades = []; // Would need to reload
            const container = document.getElementById('lib-content');
            const token = CenturiaAPI.getToken();
            const user = CenturiaAPI.getCurrentUser();
            
            if (user && token) {
                // Reload with filter
                fetch(CenturiaAPI.baseUrl + 'grades.php?action=list', { headers: { 'Authorization': 'Bearer ' + token } })
                    .then(r => r.json()).then(data => {
                        const gradesData = data.success && data.data ? data.data : [];
                        fetch(CenturiaAPI.baseUrl + 'courses.php?action=list', { headers: { 'Authorization': 'Bearer ' + token } })
                            .then(r => r.json()).then(data2 => {
                                const coursesData = data2.success && data2.data ? data2.data : [];
                                fetch(CenturiaAPI.baseUrl + 'attendance.php?action=list', { headers: { 'Authorization': 'Bearer ' + token } })
                                    .then(r => r.json()).then(data3 => {
                                        const attendanceData = data3.success && data3.data ? data3.data : [];
                                        renderAllSubjects(container, carrera, gradesData, coursesData, attendanceData);
                                    });
                            });
                    });
            }
        }

        function getGradeClass(score) {
            if (score >= 90) return 'grade-a';
            if (score >= 70) return 'grade-b';
            if (score >= 60) return 'grade-c';
            return 'grade-f';
        }

        // ═══ INIT ═══
        document.addEventListener('DOMContentLoaded', cargarLibreta);
    </script>
</body>
</html>
