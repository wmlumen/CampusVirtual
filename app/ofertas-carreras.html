<!DOCTYPE html>
<html lang="es">
<head>
    <script src="./js/session-guard.js?v=5"></script>
    <script>CenturiaSession.protect();</script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ofertas de Carreras — Campus Virtual Centuria</title>
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script>
    <link href="https://fonts.bunny.net/css?family=montserrat:300,400,500,600,700,800,900" rel="stylesheet">
    <style>
        :root {
            --verde: #00B140;
            --verde-dark: #007A33;
            --verde-card: #E6F4EA;
            --hover: #81C784;
            --dorado: #d4a843;
            --azul: #2563EB;
            --texto: #FFFFFF;
            --texto-sec: #2D2D2D;
            --bg: #007A33;
            --card-bg: #FFFFFF;
            --border: #C8E6C9;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Montserrat', sans-serif;
            min-height: 100vh;
            background: var(--bg);
            color: var(--texto);
        }
        .wrap { max-width: 1100px; margin: 0 auto; padding: 12px 16px 80px; }
        .topbar {
            position: sticky; top: 0; z-index: 100;
            background: var(--verde-dark);
            border-bottom: 2px solid var(--verde);
            padding: 10px 20px;
            display: flex; justify-content: space-between; align-items: center;
            box-shadow: 0 2px 12px rgba(0,0,0,.3);
        }
        .topbar-brand { font-size: .85rem; font-weight: 700; color: #fff; letter-spacing: 1px; }
        .topbar-nav { display: flex; gap: 8px; }
        .topbar-nav a {
            color: rgba(255,255,255,.7); text-decoration: none; border: none;
            font-size: .6rem; font-weight: 600; padding: 6px 12px;
            border-radius: 6px; transition: .2s; letter-spacing: .5px;
            background: transparent; cursor: pointer; font-family: 'Montserrat';
        }
        .topbar-nav a:hover, .topbar-nav a.active { background: var(--verde); color: #fff; }
        .section {
            background: var(--card-bg); border: none;
            border-radius: 12px; padding: 16px; margin-bottom: 12px;
            box-shadow: 0 3px 15px rgba(0,0,0,.1);
        }
        .sec-title {
            font-size: .72rem; font-weight: 700; letter-spacing: .5px;
            text-transform: uppercase; color: var(--verde-dark); margin-bottom: 12px;
            display: flex; align-items: center; gap: 6px;
            border-bottom: 2px solid var(--verde); padding-bottom: 8px;
        }
        .card {
            background: var(--verde-card); border: 1px solid var(--border);
            border-radius: 12px; padding: 24px; margin-bottom: 16px;
        }
        .card h3 { font-size: .85rem; font-weight: 700; color: var(--verde-dark); margin-bottom: 16px; padding-bottom: 8px; border-bottom: 1px solid var(--border); }
        .career-option {
            background: #fff; border: 2px solid var(--verde);
            border-radius: 10px; padding: 20px; margin-bottom: 16px;
            cursor: pointer; transition: .2s;
        }
        .career-option:hover { border-color: var(--verde-dark); transform: translateY(-2px); box-shadow: 0 4px 12px rgba(0,0,0,.15); }
        .career-option h4 { font-size: 1.1rem; font-weight: 700; color: var(--verde-dark); margin-bottom: 8px; }
        .career-option p { font-size: .75rem; color: #64748b; margin: 0; }
        .career-option .codigo { font-size: .65rem; color: var(--verde); font-weight: 600; }
        .btn-seleccionar {
            width: 100%; padding: 10px; border: none; border-radius: 8px;
            background: var(--verde); color: #fff; font-weight: 700; font-size: .75rem;
            cursor: pointer; margin-top: 16px;
        }
        .btn-seleccionar:hover { background: var(--verde-dark); }
        .no-alert { padding: 20px; text-align: center; color: #64748b; }
    </style>
</head>
<body>
    <div class="topbar">
        <div class="topbar-brand">🏛 Instituto Superior Centuria</div>
        <div class="topbar-nav">
            <a href="./dashboard.html"><i class="bi bi-speedometer2"></i> Dashboard</a>
            <a href="./dashboard.html#perfil"><i class="bi bi-person"></i> Perfil</a>
        </div>
    </div>

    <div class="wrap">
        <div class="section">
            <div class="sec-title"><i class="bi bi-grid-3x3-gap"></i> Ofertas de Carreras disponibles</div>
            <p style="font-size:.8rem;color:#64748b;margin-bottom:20px">Selecciona la carrera que deseas seguir:</p>
            
            <div id="careras-list"></div>
            <div id="career-status" role="status" aria-live="polite" style="margin-top:12px"></div>
        </div>
    </div>

    <script src="./js/api.js?v=28"></script>
    <script>
        function setCareerStatus(message, error) {
            const status = document.getElementById('career-status');
            if (!status) return;
            status.className = error ? 'alert alert-danger' : 'alert alert-success';
            status.textContent = message;
        }

        async function cargarPagina() {
            let user = window.CenturiaAPI && CenturiaAPI.getCurrentUser();
            if (!user) { location.href = 'index.html'; return; }

            try {
                const cedula = user.username || user.cedula || sessionStorage.getItem('current_cedula');
                const matricula = cedula && CenturiaAPI.matricula && await CenturiaAPI.matricula.my(cedula);
                const registro = matricula && (matricula.matricula || matricula.data);
                if (registro) {
                    user = Object.assign({}, user, {
                        nivel: user.nivel || user.grado || registro.nivel || registro.Nivel || registro.grado || registro.Grado || '',
                        carrera: user.carrera || registro.carrera || registro.Carrera || '',
                        carrera_elegida: user.carrera_elegida || registro.carrera_elegida || registro.CarreraElegida || ''
                    });
                }
                window.cvOfertasUsuario = user;
            } catch (error) {
                console.warn('No se pudo completar el perfil con la matrícula:', error);
            }

            const carerasList = document.getElementById('careras-list');
            carerasList.innerHTML = '<p class="no-alert">Cargando ofertas disponibles…</p>';
            try {
                const result = await API.programas.list(user.nivel || user.grado || '');
                if (!result || result.ok !== true) throw new Error((result && result.error) || 'No se pudieron consultar las ofertas.');
                const ofertas = (result.programas || []).filter(o =>
                    String(o.estado || o.Estado || '').trim().toUpperCase() === 'ACTIVO'
                );
                if (!ofertas.length) {
                    carerasList.innerHTML = '<p class="no-alert">No hay ofertas activas para tu nivel en este momento.</p>';
                    return;
                }
                carerasList.innerHTML = ofertas.map(o => {
                    const codigo = o.codigo || o.Codigo || o.id || '';
                    const nombre = o.nombre || o.Nombre || o.nombre_programa || 'Programa académico';
                    const descripcion = o.descripcion || o.Descripcion || '';
                    return `<article class="career-option">
                        <h4>${escaparTexto(nombre)}</h4>
                        <p>${escaparTexto(descripcion)}</p>
                        <span class="codigo">Código: ${escaparTexto(codigo)}</span>
                        <button class="btn-seleccionar" type="button" data-codigo="${escaparTexto(codigo)}" data-nombre="${escaparTexto(nombre)}">Seleccionar</button>
                    </article>`;
                }).join('');
                carerasList.querySelectorAll('[data-codigo]').forEach(button => {
                    button.addEventListener('click', () => seleccionarCarrera(button.dataset.codigo, button.dataset.nombre));
                });
            } catch (error) {
                carerasList.innerHTML = '<p class="no-alert">No se pudieron cargar las ofertas desde la nube. Recarga la página o contacta a Administración.</p>';
                setCareerStatus(error.message || 'Error al consultar el catálogo de programas.', true);
            }
        }

        function escaparTexto(value) {
            return String(value || '').replace(/[&<>"']/g, char => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[char]);
        }

        async function seleccionarCarrera(codigo, nombre) {
            const user = window.cvOfertasUsuario || CenturiaAPI.getCurrentUser();
            if (!user) { alert('Debes iniciar sesión para seleccionar una carrera'); return; }
            
            const cedula = user.username || user.cedula || sessionStorage.getItem('current_cedula');
            if (!cedula) { alert('No se pudo identificar tu cédula'); return; }
            
            setCareerStatus('Guardando tu selección en la nube…', false);
            try {
                const result = await API.usuarios.update({ cedula: cedula, carrera_elegida: codigo });
                if (!result || result.ok !== true) throw new Error((result && result.error) || 'No se confirmó el guardado en la nube.');
                const updatedUser = Object.assign({}, user, { carrera_elegida: codigo });
                try {
                    sessionStorage.setItem('centuria_user', JSON.stringify(updatedUser));
                    localStorage.setItem('centuria_user', JSON.stringify(updatedUser));
                    localStorage.setItem('centuria_carrera_elegida_' + cedula, codigo);
                } catch (e) {}
                setCareerStatus('Selección guardada en tu perfil: ' + nombre + ' (' + codigo + ').', false);
            } catch (error) {
                setCareerStatus('No se pudo guardar tu selección en la nube. ' + (error.message || ''), true);
            }
        }

        document.addEventListener('DOMContentLoaded', cargarPagina);
    </script>
</body>
</html>
