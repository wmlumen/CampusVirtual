<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Perfil — Campus Virtual Centuria</title>
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root{
            --verde:#16813D;--verde-d:#0D5C2A;--verde-l:#22c55e;
            --dorado:#D4A017;--dorado-l:#F5D76E;
            --azul:#2563EB;--rosa:#D94172;--naranja:#D97706;
            --txt:#0f172a;--txt2:#475569;--txt3:#94a3b8;
            --bg:#f1f5f9;--card:#fff;--bdr:#cbd5e1;
        }
        *{box-sizing:border-box;margin:0;padding:0}
        body{font-family:'Montserrat',sans-serif;background:var(--bg);color:var(--txt);min-height:100vh}

        .wrap{max-width:800px;margin:0 auto;padding:16px 16px 50px}

        /* Header */
        .hdr{display:flex;justify-content:space-between;align-items:center;background:var(--card);border:1px solid var(--bdr);border-radius:14px;padding:10px 16px;margin-bottom:12px;box-shadow:0 1px 3px rgba(0,0,0,.04)}
        .hdr-left{display:flex;align-items:center;gap:10px}
        .avatar{width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,var(--verde),var(--verde-d));display:flex;align-items:center;justify-content:center;font-size:.85rem;font-weight:700;color:#fff}
        .hdr-name{font-size:.85rem;font-weight:700}
        .hdr-sub{font-size:.6rem;font-weight:500;color:var(--txt2)}
        .badge-rol{padding:4px 10px;border-radius:20px;font-size:.55rem;font-weight:700;letter-spacing:.5px;text-transform:uppercase;background:#BBF7D0;color:var(--verde-d)}
        .badge-rol.docente{background:#BFDBFE;color:#1E3A8A}
        .badge-rol.admin{background:#FEF3C7;color:#92400E}
        .btn-out{padding:5px 10px;border-radius:8px;font-size:.6rem;background:#FEE2E2;color:#991B1B;border:1px solid #FECACA;cursor:pointer;font-family:'Montserrat';font-weight:700}

        .back{display:inline-flex;align-items:center;gap:4px;font-size:.7rem;font-weight:600;color:var(--azul);text-decoration:none;margin-bottom:10px}
        .back:hover{color:var(--verde)}

        /* Profile Card */
        .profile-card{background:var(--card);border:1px solid var(--bdr);border-radius:16px;overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,.04)}

        /* Banner */
        .banner{height:100px;background:linear-gradient(135deg,var(--verde-d),var(--verde),#22c55e);position:relative}
        .banner::after{content:'';position:absolute;inset:0;background:url("data:image/svg+xml,%3Csvg width='40' height='40' xmlns='http://www.w3.org/2000/svg'%3E%3Ccircle cx='20' cy='20' r='1' fill='rgba(255,255,255,.08)'/%3E%3C/svg%3E")}

        /* Avatar zone */
        .avatar-zone{text-align:center;margin-top:-50px;position:relative;z-index:2}
        .avatar-big{width:90px;height:90px;border-radius:50%;background:linear-gradient(135deg,var(--verde),var(--verde-d));display:inline-flex;align-items:center;justify-content:center;font-size:2rem;font-weight:800;color:#fff;border:4px solid var(--card);box-shadow:0 4px 16px rgba(0,0,0,.15)}
        .profile-name{font-size:1.1rem;font-weight:800;margin-top:8px}
        .profile-role{font-size:.65rem;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--verde)}
        .profile-cedula{font-size:.6rem;color:var(--txt3);margin-top:2px}

        /* Body */
        .card-body{padding:16px 20px 24px}

        /* Sections */
        .sec{background:#f8fafc;border:1px solid var(--bdr);border-radius:12px;padding:14px;margin-bottom:10px}
        .sec-title{font-size:.7rem;font-weight:700;text-transform:uppercase;color:var(--txt);margin-bottom:10px;display:flex;align-items:center;gap:6px}
        .sec-title i{color:var(--dorado)}

        /* Rows */
        .row-item{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid #f1f5f9}
        .row-item:last-child{border-bottom:none}
        .row-label{font-size:.68rem;font-weight:600;color:var(--txt3);text-transform:uppercase;letter-spacing:.3px}
        .row-value{font-size:.78rem;font-weight:600;color:var(--txt);text-align:right;max-width:55%}

        /* Edit mode */
        .row-value.editable{cursor:pointer;padding:4px 8px;border-radius:6px;transition:.15s}
        .row-value.editable:hover{background:#EFF6FF;color:var(--azul)}
        .row-input{width:100%;max-width:200px;padding:6px 10px;border:2px solid var(--azul);border-radius:8px;font-size:.78rem;font-family:'Montserrat';font-weight:600;color:var(--txt);background:#fff;outline:none;text-align:right}

        /* Buttons */
        .btns{display:flex;gap:8px;margin-top:12px}
        .btn{flex:1;padding:10px;border-radius:10px;font-size:.7rem;font-family:'Montserrat';font-weight:700;cursor:pointer;border:none;transition:.15s;display:flex;align-items:center;justify-content:center;gap:4px}
        .btn-p{background:var(--azul);color:#fff}.btn-p:hover{background:#1d4ed8}
        .btn-g{background:#BBF7D0;color:var(--verde-d)}.btn-g:hover{background:#86efac}
        .btn-s{background:#F1F5F9;color:var(--txt)}.btn-s:hover{background:#e2e8f0}
        .btn-r{background:#FEE2E2;color:#991B1B}.btn-r:hover{background:#fca5a5}

        /* Stats row */
        .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px}
        .stat{background:#f8fafc;border:1px solid var(--bdr);border-radius:10px;padding:10px;text-align:center}
        .stat-val{font-size:1rem;font-weight:800;color:var(--verde)}
        .stat-lbl{font-size:.5rem;font-weight:600;color:var(--txt3);text-transform:uppercase}

        /* Toast */
        .toast{position:fixed;top:20px;right:20px;padding:12px 20px;border-radius:10px;font-size:.72rem;font-weight:600;z-index:9999;animation:fadeIn .3s;box-shadow:0 4px 16px rgba(0,0,0,.15)}
        .toast-success{background:#BBF7D0;color:#16813D;border:1px solid #86efac}
        .toast-error{background:#FEE2E2;color:#991B1B;border:1px solid #fca5a5}
        @keyframes fadeIn{from{opacity:0;transform:translateY(-10px)}to{opacity:1;transform:translateY(0)}}

        .footer{position:fixed;bottom:0;left:0;right:0;text-align:center;padding:5px 16px;background:var(--card);border-top:1px solid var(--bdr);font-size:.5rem;font-weight:500;color:var(--txt3)}
        @media print{.footer,.btn-out,.btns{display:none!important}body{background:#fff}}
        @media(max-width:768px){.wrap{padding:10px 10px 50px}.stats{grid-template-columns:repeat(3,1fr)}.hdr{flex-direction:column;gap:8px}.row-input{max-width:140px}}
    </style>
</head>
<body>
<div class="wrap">
    <!-- Header -->
    <div class="hdr">
        <div class="hdr-left">
            <div class="avatar" id="hdr-avatar">P</div>
            <div><div class="hdr-name" id="hdr-name">Cargando...</div><div class="hdr-sub">Mi Perfil</div></div>
        </div>
        <div style="display:flex;align-items:center;gap:8px">
            <span class="badge-rol" id="hdr-badge">-</span>
            <button class="btn-out" onclick="centuriaLogout(true)"><i class="bi bi-box-arrow-right"></i> Salir</button>
        </div>
    </div>

    <a href="dashboard.html" class="back"><i class="bi bi-arrow-left"></i> Volver al Dashboard</a>

    <!-- Stats rápidas -->
    <div class="stats">
        <div class="stat"><div class="stat-val" id="st-asig">0</div><div class="stat-lbl">Asignaturas</div></div>
        <div class="stat"><div class="stat-val" id="st-prom">-</div><div class="stat-lbl">Promedio</div></div>
        <div class="stat"><div class="stat-val" id="st-asist">-</div><div class="stat-lbl">Asistencia</div></div>
    </div>

    <!-- Profile Card -->
    <div class="profile-card">
        <div class="banner"></div>
        <div class="avatar-zone">
            <div class="avatar-big" id="avatar-big">P</div>
            <div class="profile-name" id="profile-name">Cargando...</div>
            <div class="profile-role" id="profile-role">-</div>
            <div class="profile-cedula" id="profile-cedula">C.I: -</div>
        </div>

        <div class="card-body">
            <!-- Datos Personales -->
            <div class="sec">
                <div class="sec-title"><i class="bi bi-person"></i> Datos Personales</div>
                <div class="row-item"><span class="row-label">Cédula</span><span class="row-value" id="p-cedula">-</span></div>
                <div class="row-item"><span class="row-label">Nombre</span><span class="row-value editable" id="p-nombre" data-field="firstname" onclick="editarCampo(this)">-</span></div>
                <div class="row-item"><span class="row-label">Apellido</span><span class="row-value editable" id="p-apellido" data-field="lastname" onclick="editarCampo(this)">-</span></div>
                <div class="row-item"><span class="row-label">Email</span><span class="row-value editable" id="p-email" data-field="email" onclick="editarCampo(this)">-</span></div>
                <div class="row-item"><span class="row-label">Teléfono</span><span class="row-value editable" id="p-telefono" data-field="telefono" onclick="editarCampo(this)">-</span></div>
            </div>

            <!-- Datos Académicos -->
            <div class="sec">
                <div class="sec-title"><i class="bi bi-mortarboard"></i> Datos Académicos</div>
                <div class="row-item"><span class="row-label">Grado</span><span class="row-value" id="p-grado">-</span></div>
                <div class="row-item"><span class="row-label">Carrera</span><span class="row-value" id="p-carrera">-</span></div>
                <div class="row-item"><span class="row-label">Sección</span><span class="row-value" id="p-seccion">-</span></div>
                <div class="row-item"><span class="row-label">Rol</span><span class="row-value" id="p-rol">-</span></div>
                <div class="row-item"><span class="row-label">Estado</span><span class="row-value" id="p-estado">-</span></div>
                <div class="row-item"><span class="row-label">Último Acceso</span><span class="row-value" id="p-login">-</span></div>
            </div>

            <!-- Botones -->
            <div class="btns">
                <button class="btn btn-p" onclick="window.print()"><i class="bi bi-printer"></i> Imprimir</button>
                <button class="btn btn-s" onclick="centuriaLogout(false)"><i class="bi bi-box-arrow-left"></i> Login</button>
            </div>
        </div>
    </div>
</div>

<div class="footer">Instituto Superior Centuria © 2026 — Perfil Académico</div>

<script src="js/api.js?v=7"></script>
<script src="js/logout.js"></script>
<script>
let userId = null;
let editando = null;

async function cargarPerfil() {
    try {
        const token = CenturiaAPI.getToken();
        const user = CenturiaAPI.getCurrentUser();

        if (!user) {
            const cedula = localStorage.getItem('centuria_cedula');
            if (!cedula) { location.href = 'index.html'; return; }
            await cargarPorCedula(cedula);
            return;
        }

        mostrar(user);
        userId = user.id;
        await cargarStats(user, token);
    } catch(e) {
        console.error(e);
        const cedula = localStorage.getItem('centuria_cedula');
        if (cedula) await cargarPorCedula(cedula);
    }
}

async function cargarPorCedula(cedula) {
    try {
        const resp = await fetch(CenturiaAPI.baseUrl + 'usuarios.php?action=get&id=' + cedula, {
            headers: { 'Authorization': 'Bearer ' + CenturiaAPI.getToken() }
        });
        const data = await resp.json();
        if (data.success && data.data) {
            userId = data.data.id;
            mostrar(data.data);
        } else {
            mostrarLocal();
        }
    } catch(e) { mostrarLocal(); }
}

function mostrar(user) {
    const n = user.firstname || user.nombre || 'Usuario';
    const a = user.lastname || user.apellido || '';
    const c = user.username || user.cedula || '';
    const r = user.role || user.rol || 'alumno';
    const g = user.grado || '';
    const ca = user.carrera || '';
    const s = user.seccion || '';
    const e = user.email || '';
    const t = user.telefono || '';
    const est = user.estado || 'activo';
    const login = user.last_login || '';

    document.getElementById('profile-name').textContent = n + ' ' + a;
    document.getElementById('profile-role').textContent = r.toUpperCase();
    document.getElementById('profile-cedula').textContent = 'C.I: ' + c;
    document.getElementById('hdr-name').textContent = n + ' ' + a;
    document.getElementById('hdr-avatar').textContent = (n.charAt(0) + a.charAt(0)).toUpperCase();
    document.getElementById('avatar-big').innerHTML = '<span>' + (n.charAt(0) + a.charAt(0)).toUpperCase() + '</span>';

    const badge = document.getElementById('hdr-badge');
    const config = {alumno:'Alumno',docente:'Docente',admin:'Admin',academico:'Académico',administrador_plataforma:'Admin Plataforma',admin_filial:'Admin Filial'};
    badge.textContent = config[r] || r;
    badge.className = 'badge-rol' + (r === 'docente' ? ' docente' : (r === 'admin' || r === 'administrador_plataforma' || r === 'admin_filial') ? ' admin' : '');

    document.getElementById('p-cedula').textContent = c;
    document.getElementById('p-nombre').textContent = n;
    document.getElementById('p-apellido').textContent = a;
    document.getElementById('p-email').textContent = e || 'No registrado';
    document.getElementById('p-telefono').textContent = t || 'No registrado';
    document.getElementById('p-grado').textContent = g || 'No asignado';
    document.getElementById('p-carrera').textContent = ca || 'No asignado';
    document.getElementById('p-seccion').textContent = s || 'No asignado';
    document.getElementById('p-rol').textContent = (config[r] || r).toUpperCase();
    document.getElementById('p-estado').textContent = est.toUpperCase();
    document.getElementById('p-login').textContent = login ? new Date(login).toLocaleDateString('es-ES') : '-';
}

function mostrarLocal() {
    const c = localStorage.getItem('centuria_cedula') || '';
    const n = localStorage.getItem('centuria_nombre') || '';
    const a = localStorage.getItem('centuria_apellido') || '';
    const r = localStorage.getItem('centuria_rol') || 'alumno';

    document.getElementById('profile-name').textContent = n + ' ' + a;
    document.getElementById('profile-role').textContent = r.toUpperCase();
    document.getElementById('profile-cedula').textContent = 'C.I: ' + c;
    document.getElementById('hdr-name').textContent = n + ' ' + a;
    document.getElementById('hdr-avatar').textContent = (n.charAt(0) + a.charAt(0)).toUpperCase();
    document.getElementById('avatar-big').innerHTML = '<span>' + (n.charAt(0) + a.charAt(0)).toUpperCase() + '</span>';

    document.getElementById('p-cedula').textContent = c;
    document.getElementById('p-nombre').textContent = n;
    document.getElementById('p-apellido').textContent = a;
    document.getElementById('p-email').textContent = localStorage.getItem('centuria_email') || 'No registrado';
    document.getElementById('p-telefono').textContent = 'No registrado';
    document.getElementById('p-grado').textContent = localStorage.getItem('centuria_grado') || 'No asignado';
    document.getElementById('p-carrera').textContent = localStorage.getItem('centuria_carrera') || 'No asignado';
    document.getElementById('p-seccion').textContent = localStorage.getItem('centuria_seccion') || 'No asignado';
    document.getElementById('p-rol').textContent = r.toUpperCase();
    document.getElementById('p-estado').textContent = 'ACTIVO';
}

// ═══ MODO EDICIÓN ═══
function editarCampo(el) {
    if (editando) return;
    editando = el;
    const valor = el.textContent.trim();
    const field = el.dataset.field;
    el.innerHTML = `<input class="row-input" type="${field === 'email' ? 'email' : 'text'}" value="${valor === 'No registrado' ? '' : valor}" 
        onblur="guardarCampo(this, '${field}')" onkeydown="if(event.key==='Enter')this.blur();if(event.key==='Escape'){cancelarEdicion(this,'${field}')}">`;
    el.querySelector('input').focus();
    el.querySelector('input').select();
}

function cancelarEdicion(input, field) {
    const el = input.parentElement;
    const original = input.defaultValue || '-';
    el.textContent = original;
    editando = null;
}

async function guardarCampo(input, field) {
    const el = input.parentElement;
    const valor = input.value.trim();
    el.textContent = valor || '-';
    editando = null;

    if (!userId || !valor) return;

    try {
        const fd = new FormData();
        fd.append('action', 'update_profile');
        fd.append('user_id', userId);
        fd.append(field, valor);

        const resp = await fetch(CenturiaAPI.baseUrl + 'usuarios.php?action=update_profile', {
            method: 'POST',
            headers: { 'Authorization': 'Bearer ' + CenturiaAPI.getToken() },
            body: fd
        });
        const data = await resp.json();

        if (data.success) {
            showToast('Campo actualizado correctamente', 'success');
        } else {
            showToast('Error al guardar', 'error');
        }
    } catch(e) {
        showToast('Error de conexión', 'error');
    }
}

function showToast(msg, type) {
    const t = document.createElement('div');
    t.className = 'toast toast-' + type;
    t.textContent = msg;
    document.body.appendChild(t);
    setTimeout(() => t.remove(), 3000);
}

// ═══ STATS ═══
async function cargarStats(user, token) {
    try {
        const cedula = user.username || user.cedula || localStorage.getItem('centuria_cedula');
        const rol = user.role || user.rol || 'alumno';

        // Asignaturas
        if (rol === 'docente') {
            const r = await fetch(CenturiaAPI.baseUrl + 'docente.php?action=my_subjects&cedula=' + cedula, {
                headers: { 'Authorization': 'Bearer ' + token }
            });
            const d = await r.json();
            document.getElementById('st-asig').textContent = (d.subjects || []).length;
        } else {
            const r = await fetch(CenturiaAPI.baseUrl + 'asignaturas.php?action=list');
            const d = await r.json();
            document.getElementById('st-asig').textContent = (d.items || d.asignaturas || []).length;
        }

        // Notas
        const rN = await fetch(CenturiaAPI.baseUrl + 'grades.php?action=list', {
            headers: { 'Authorization': 'Bearer ' + token }
        });
        const dN = await rN.json();
        const grades = dN.data || [];
        if (grades.length > 0) {
            const avg = (grades.reduce((s, g) => s + (g.score || 0), 0) / grades.length).toFixed(1);
            document.getElementById('st-prom').textContent = avg;
        }

        // Asistencia
        const rA = await fetch(CenturiaAPI.baseUrl + 'attendance.php?action=list', {
            headers: { 'Authorization': 'Bearer ' + token }
        });
        const dA = await rA.json();
        const asist = dA.data || [];
        if (asist.length > 0) {
            const pct = Math.round((asist.filter(a => a.status === 'present' || a.estado === 'presente').length / asist.length) * 100);
            document.getElementById('st-asist').textContent = pct + '%';
        }
    } catch(e) {}
}

document.addEventListener('DOMContentLoaded', cargarPerfil);
</script>
</body>
</html>
